<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 3D — Offline Embedded Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050f; font-family: sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 24px; font-weight: bold; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); text-align: center; z-index: 10;
        }
        #instructions { font-size: 14px; color: #00adb5; margin-top: 5px; }
        #alive-counter { font-size: 16px; color: #ff2e63; margin-top: 5px; }
    </style>
    <!-- Встраиваем Three.js напрямую, чтобы обойти блокировки безопасности браузера -->
    <script>
        /* Three.js r128 Embedded Core */

        E.Vector3=function(x,y,z){this.x=x||0,this.y=y||0,this.z=z||0},E.Vector3.prototype={set:function(x,y,z){return this.x=x,this.y=y,this.z=z,this},addScaledVector:function(v,s){return this.x+=v.x*s,this.y+=v.y*s,this.z+=v.z*s,this},distanceTo:function(v){return Math.sqrt((this.x-v.x)**2+(this.y-v.y)**2+(this.z-v.z)**2)},normalize:function(){var l=Math.sqrt(this.x**2+this.y**2+this.z**2)||1;return this.x/=l,this.y/=l,this.z/=l,this},subVectors:function(a,b){return this.x=a.x-b.x,this.y=a.y-b.y,this.z=a.z-b.z,this},lerp:function(v,alpha){return this.x+=(v.x-this.x)*alpha,this.y+=(v.y-this.y)*alpha,this.z+=(v.z-this.z)*alpha,this},clone:function(){return new E.Vector3(this.x,this.y,this.z)}};

        E.BoxGeometry=function(w,h,d){this.w=w,this.h=h,this.d=d};E.SphereGeometry=function(r){this.w=r*2,this.h=r*2,this.d=r*2};

        E.WebGLRenderer.prototype={setSize:function(w,h){this.domElement.width=w,this.domElement.height=h},render:function(scene,camera){

            var sorted=scene.children.slice().sort((a,b)=>b.position.z-a.position.z);
            for(var i=0;i<sorted.length;i++){
                var o=sorted[i];if(!o.geometry)continue;

                var sz=fov/(rz+fov);if(sz<0)continue;
                var sx=w/2+rx*sz*20,sy=h/2-ry*sz*20;
                var sw=o.geometry.w*sz*20,sh=o.geometry.h*sz*20;

    </script>
</head>
<body>

    <div id="ui">
        Счёт отбиваний: <span id="score">0</span>
        <div id="alive-counter">Осталось бойцов: <span id="bots-count">4</span></div>
        <div id="instructions">WASD / Стрелки — движение | ПРОБЕЛ — блок вовремя</div>
    </div>

    <script>
        // === ЧАСТЬ 1: НАСТРОЙКИ СЦЕНЫ И ГЕНЕРАЦИЯ ОБЪЕКТОВ ===
        let scene, camera, renderer, player, ball;
        let bots = [];
        let currentTarget = null;
        
        let keys = { w: false, a: false, s: false, d: false, Space: false };
        let ballSpeed = 0.18;
        let ballDirection = new THREE.Vector3();
        let score = 0;
        let isBlocking = false;
        let blockCooldown = false;

        const ARENA_SIZE = 25;
        const BOT_COUNT = 3;

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Пол Арены
            const floorGeo = new THREE.BoxGeometry(ARENA_SIZE * 2, 1, ARENA_SIZE * 2);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x1f1f2e });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(0, -0.5, 0);
            scene.add(floor);

            // Игрок (Синий куб персонажа)
            const playerGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
            const playerMat = new THREE.MeshBasicMaterial({ color: 0x00adb5 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.8, 14);
            player.isPlayer = true;
            player.isAlive = true;
            scene.add(player);

            // Мяч-убийца (Красный куб)
            const ballGeo = new THREE.SphereGeometry(0.8);
            const ballMat = new THREE.MeshBasicMaterial({ color: 0xff2e63 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(0, 0.8, -12);
            scene.add(ball);

            createBots();

            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            selectNewTarget();
            animate();
        }

        function createBots() {
            bots.forEach(b => scene.remove(b));
            bots = [];
            const botGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);

            for (let i = 0; i < BOT_COUNT; i++) {
                const botMat = new THREE.MeshBasicMaterial({ color: 0x9b5de5 });
                const bot = new THREE.Mesh(botGeo, botMat);
                bot.position.set((Math.random() - 0.5) * (ARENA_SIZE * 1.4), 0.8, (Math.random() - 0.5) * (ARENA_SIZE * 1.4));
                bot.isPlayer = false;
                bot.isAlive = true;
                bot.aiTimer = 0;
                bot.moveDir = new THREE.Vector3();
                bot.isBlocking = false;
                bots.push(bot);
                scene.add(bot);
            }
        }        // === ЧАСТЬ 2: УПРАВЛЕНИЕ, ФИЗИКА И АВТОНОМНЫЙ ЦИКЛ ОТРИСОВКИ ===
        function selectNewTarget(exception) {
            let pool = [];
            if (player && player.isAlive && player !== exception) pool.push(player);
            bots.forEach(b => {
                if (b.isAlive && b !== exception) pool.push(b);
            });

            if (pool.length === 0 && exception && exception.isAlive) {
                pool.push(exception);
            }

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                bots.forEach(b => { if(b.isAlive) b.material.color = 0x9b5de5; });
                if (player && player.isAlive && !isBlocking) player.material.color = 0x00adb5;
                
                if (currentTarget !== player) {
                    currentTarget.material.color = 0xff9f1c; // Оранжевая цель
                }
            } else {
                currentTarget = null;
            }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = ((player && player.isAlive) ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            
            if (count === 1 && player && player.isAlive) {
                alert("ПОБЕДА! Вы уничтожили всех ботов!");
                restartGame();
            }
        }

        function restartGame() {
            if (!player || !ball) return;
            player.isAlive = true;
            player.position.set(0, 0.8, 14);
            player.material.color = 0x00adb5;
            
            createBots();
            
            ball.position.set(0, 0.8, -12);
            ballSpeed = 0.18;
            score = 0;
            document.getElementById('score').innerText = score;
            
            selectNewTarget();
        }

        function handleInput(e, isDown) {
            let key = e.key.toLowerCase();
            if (e.code === 'Space') key = 'Space';
            if (e.key === 'ArrowUp') key = 'w';
            if (e.key === 'ArrowDown') key = 's';
            if (e.key === 'ArrowLeft') key = 'a';
            if (e.key === 'ArrowRight') key = 'd';

            if (keys.hasOwnProperty(key)) keys[key] = isDown;

            if (key === 'Space' && isDown && !blockCooldown && !isBlocking && player && player.isAlive) {
                triggerPlayerBlock();
            }
        }

        function triggerPlayerBlock() {
            isBlocking = true;
            blockCooldown = true;
            player.material.color = 0x00ff00; // Зеленый блок

            setTimeout(() => {
                isBlocking = false;
                if (currentTarget === player) player.material.color = 0xff9f1c;
                else player.material.color = 0x00adb5;
                
                setTimeout(() => { blockCooldown = false; }, 400);
            }, 300);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!player || !ball) return;

            // 1. Движение игрока
            if (player.isAlive) {
                const moveSpeed = 0.22;
                if (keys.w && player.position.z > -ARENA_SIZE) player.position.z -= moveSpeed;
                if (keys.s && player.position.z < ARENA_SIZE) player.position.z += moveSpeed;
                if (keys.a && player.position.x > -ARENA_SIZE) player.position.x -= moveSpeed;
                if (keys.d && player.position.x < ARENA_SIZE) player.position.x += moveSpeed;
            }

            // 2. Движение ботов
            bots.forEach(bot => {
                if (!bot.isAlive) return;

                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.random() * 60 + 30;
                    bot.moveDir.set(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                }

                bot.position.addScaledVector(bot.moveDir, 0.12);
                
                bot.position.x = Math.max(-ARENA_SIZE + 1, Math.min(ARENA_SIZE - 1, bot.position.x));
                bot.position.z = Math.max(-ARENA_SIZE + 1, Math.min(ARENA_SIZE - 1, bot.position.z));

                let distToBall = bot.position.distanceTo(ball.position);
                if (currentTarget === bot && distToBall < (3.0 + ballSpeed * 5) && !bot.isBlocking) {
                    if (Math.random() > 0.15) { 
                        bot.isBlocking = true;
                        bot.material.color = 0xffffff; // Белая вспышка блока бота
                        
                        setTimeout(() => {
                            bot.isBlocking = false;
                            if (bot.isAlive) bot.material.color = 0x9b5de5;
                        }, 250);
                    }
                }
            });

            // 3. Самонаведение и логика мяча
            if (currentTarget && currentTarget.isAlive) {
                let targetDir = new THREE.Vector3().subVectors(currentTarget.position, ball.position).normalize();
                ballDirection.lerp(targetDir, 0.08); 
                ball.position.addScaledVector(ballDirection, ballSpeed);

                const distance = currentTarget.position.distanceTo(ball.position);

                if (distance < 3.5) {
                    let isTargetBlocking = currentTarget.isPlayer ? isBlocking : currentTarget.isBlocking;

                    if (isTargetBlocking) {
                        ballSpeed += 0.025;
                        if (currentTarget.isPlayer) {
                            score++;
                            document.getElementById('score').innerText = score;
                        }
                        selectNewTarget(currentTarget);
                    } 
                    else if (distance < 1.4) {
                        if (currentTarget.isPlayer) {
                            player.isAlive = false;
                            alert(`Вы выбыли! Счёт отбиваний: ${score}`);
                            restartGame();
                        } else {
                            currentTarget.isAlive = false;
                            scene.remove(currentTarget);
                            ballSpeed = Math.max(0.18, ballSpeed - 0.05);
                            selectNewTarget();
                        }
                    }
                }
            } else {
                selectNewTarget();
            }

            // 4. Расчет положения камеры от третьего лица
            if (player.isAlive) {
                camera.position.x = player.position.x;
                camera.position.y = player.position.y + 6;
                camera.position.z = player.position.z + 12;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 2);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Принудительный запуск
        init();
    </script>
</body>
</html>
