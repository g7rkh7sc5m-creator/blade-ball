<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 2D — Lobby & Skins Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050f; font-family: 'Arial Black', sans-serif; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui {
            position: absolute; top: 15px; color: white; font-size: 20px; text-transform: uppercase; pointer-events: none;
            text-shadow: 3px 3px 0px #000; text-align: center; z-index: 10; letter-spacing: 1px; width: 100%;
        }
        #instructions { font-size: 12px; color: #00adb5; margin-top: 5px; }
        #alive-counter { font-size: 15px; color: #ff2e63; margin-top: 3px; }
        #danger-alert { 
            position: absolute; bottom: 120px; color: #ff2e63; font-size: 28px; display: none; text-shadow: 2px 2px 0px #000;
            animation: blink 0.3s infinite alternate; font-weight: bold; z-index: 10; left: 50%; transform: translateX(-50%);
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
        
        /* Магазин скинов в Лобби */
        #shop-ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(22, 25, 43, 0.85); padding: 10px;
            border-radius: 12px; border: 3px solid #16192b; z-index: 11; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .shop-btn {
            background: #222538; color: white; border: 2px solid #00adb5; padding: 8px 12px;
            font-family: sans-serif; font-weight: bold; font-size: 12px; cursor: pointer; border-radius: 6px; text-transform: uppercase;
        }
        .shop-btn:hover { background: #00adb5; color: #000; }
        .shop-btn.active { border-color: #00ff00; background: #004400; }
        
        canvas { border: 4px solid #16192b; box-shadow: 0 0 25px rgba(0, 173, 181, 0.2); background: #090a14; }
    </style>
</head>
<body>

    <div id="ui">
        МОНЕТЫ: <span id="coins">0</span> | ОТБИТО: <span id="score">0</span>
        <div id="alive-counter">СТАТУС: <span id="game-status">В ЛОББИ</span> | ЖИВЫХ БОЙЦОВ: <span id="bots-count">0</span></div>
        <div id="instructions">WASD — бег | ПРОБЕЛ — блок | SHIFT — рывок (Dash)</div>
    </div>
    
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>

    <!-- Кнопки магазина -->
    <div id="shop-ui">
        <button class="shop-btn active" id="skin-red" onclick="changeSkin('#ff0055', 'Стандарт')">🔴 Дефолт</button>
        <button class="shop-btn" id="skin-green" onclick="changeSkin('#00ff00', 'Изумруд')">🟢 Неон (10 монет)</button>
        <button class="shop-btn" id="skin-gold" onclick="changeSkin('#fee440', 'Золото')">🟡 Голда (25 монет)</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 700;

        // Игровая экономика и кастомизация
        let coins = 0;
        let score = 0;
        let ballColor = '#ff0055';
        let purchasedSkins = ['Стандарт'];

        let ballSpeed = 5;
        let isBlocking = false;
        let blockCooldown = false;
        let dashCooldown = false;
        let keys = { w: false, a: false, s: false, d: false };

        // Игрок теперь появляется в ЛОББИ (внизу карты)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            radius: 20,
            color: '#00adb5',
            isAlive: true,
            isPlayer: true,
            angle: 0,
            inMatch: false // Находится ли игрок в самом матче на арене
        };

        let bots = [];
        const botColors = ['#9b5de5', '#f15bb5', '#00f5d4'];
        let matchActive = false; // Идет ли битва на арене

        const ball = { x: canvas.width / 2, y: 180, radius: 12, trail: [] };
        let currentTarget = null;

        // Магазин скинов
        function changeSkin(color, name) {
            const prices = { 'Изумруд': 10, 'Золото': 25 };
            if (!purchasedSkins.includes(name)) {
                if (coins >= prices[name]) {
                    coins -= prices[name];
                    purchasedSkins.push(name);
                    document.getElementById('coins').innerText = coins;
                } else {
                    alert("Недостаточно монет! Отбивай мяч на Арене, чтобы заработать.");
                    return;
                }
            }
            ballColor = color;
            document.querySelectorAll('.shop-btn').forEach(b => b.classList.remove('active'));
            if(name === 'Стандарт') document.getElementById('skin-red').classList.add('active');
            if(name === 'Изумруд') document.getElementById('skin-green').classList.add('active');
            if(name === 'Золото') document.getElementById('skin-gold').classList.add('active');
        }

        function startNewMatch() {
            if (matchActive) return;
            matchActive = true;
            ballSpeed = 5.5;
            
            bots = [];
            for (let i = 0; i < 3; i++) {
                bots.push({
                    x: Math.random() * (canvas.width - 150) + 75,
                    y: Math.random() * 200 + 80,
                    radius: 20,
                    color: botColors[i],
                    isAlive: true,
                    isPlayer: false,
                    isBlocking: false,
                    aiTimer: 0, moveX: 0, moveY: 0, angle: 0, inMatch: true
                });
            }

            ball.x = canvas.width / 2;
            ball.y = 180;
            ball.trail = [];

            if (player.inMatch && player.isAlive) {
                selectNewTarget();
            } else {
                // Если зашли на арену позже или наблюдаем
                selectNewTarget(player);
            }
        }

        function selectNewTarget(exception) {
            let pool = [];
            if (player.isAlive && player.inMatch && player !== exception) pool.push(player);
            bots.forEach(b => { if (b.isAlive) pool.push(b); });

            // Если остался один выживший бот/игрок, который только что отбил
            if (pool.length === 0 && exception && exception.isAlive && exception.inMatch) pool.push(exception);

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('danger-alert').style.display = (currentTarget === player && player.isAlive) ? 'block' : 'none';
            } else {
                currentTarget = null;
                matchActive = false; // Все умерли
            }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = (player.isAlive && player.inMatch ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            document.getElementById('game-status').innerText = matchActive ? "БИТВА" : "ОЖИДАНИЕ";

            if (matchActive && count === 1) {
                let winner = player.isAlive && player.inMatch ? player : bots.find(b => b.isAlive);
                if (winner && winner.isPlayer) {
                    alert("👑 ПОБЕДА! Вы уничтожили всех ботов и получили +5 монет!");
                    coins += 5;
                    document.getElementById('coins').innerText = coins;
                }
                matchActive = false;
                currentTarget = null;
            }
        }

        function drawCharacter(char) {
            if (!char.isAlive) return;

            ctx.save();
            ctx.translate(char.x, char.y);
            ctx.rotate(char.angle);

            // Кольцо таргета
            if (currentTarget === char && matchActive) {
                ctx.beginPath();
                ctx.arc(0, 0, char.radius + 8, 0, Math.PI * 2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = char.isPlayer ? '#ff0000' : '#ffaa00';
                ctx.stroke();
            }

            // Эффект блока
            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.beginPath();
                ctx.arc(0, 0, char.radius + 12, -Math.PI/3, Math.PI/3);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#00ff00';
                ctx.stroke();
            }

            // Руки
            ctx.fillStyle = char.color;
            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.fillRect(char.radius - 5, -15, 12, 8);
                ctx.fillRect(char.radius - 5, 7, 12, 8);
            } else {
                ctx.fillRect(-5, -char.radius - 4, 10, 8);
                ctx.fillRect(-5, char.radius - 4, 10, 8);
            }

            // Тело
            ctx.beginPath();
            ctx.arc(0, 0, char.radius, 0, Math.PI * 2);
            ctx.fillStyle = char.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // Голова
            ctx.beginPath();
            ctx.arc(2, 0, char.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffdbac';
            ctx.fill();
            ctx.stroke();

            // Игрок отличается! Добавляем крутые НАУШНИКИ АГЕНТА игроку
            if (char.isPlayer) {
                ctx.fillStyle = '#ff2e63';
                ctx.fillRect(-4, -char.radius - 2, 8, 5); // Левое ухо у наушников
                ctx.fillRect(-4, char.radius - 3, 8, 5);  // Правое ухо у наушников
                ctx.beginPath();
                ctx.arc(-2, 0, char.radius + 1, -Math.PI/2, Math.PI/2, true); // Ободок
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ff2e63';
                ctx.stroke();
            }

            ctx.restore();
        }        // Обработка клавиш и способностей
        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (e.code === 'Space') {
                if (!blockCooldown && !isBlocking && player.isAlive && player.inMatch) {
                    isBlocking = true;
                    blockCooldown = true;
                    setTimeout(() => {
                        isBlocking = false;
                        setTimeout(() => { blockCooldown = false; }, 200);
                    }, 280);
                }
            }
            // СПОСОБНОСТЬ: РЫВОК (DASH) НА SHIFT
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                if (!dashCooldown && player.isAlive) {
                    dashCooldown = true;
                    
                    // Вычисляем вектор направления по нажатым кнопкам
                    let dx = 0, dy = 0;
                    if (keys.w) dy = -1; if (keys.s) dy = 1;
                    if (keys.a) dx = -1; if (keys.d) dx = 1;
                    
                    // Если никуда не жмет, дешится вперед по направлению взгляда
                    if (dx === 0 && dy === 0) { dx = Math.cos(player.angle); dy = Math.sin(player.angle); }
                    
                    player.x += dx * 65;
                    player.y += dy * 65;
                    
                    setTimeout(() => { dashCooldown = false; }, 1500); // 1.5 секунды перезарядки
                }
            }
            if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        function update() {
            // Очистка экрана
            ctx.fillStyle = '#090a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Отрисовка ЗОНЫ ЛОББИ (Снизу)
            ctx.fillStyle = '#121424';
            ctx.fillRect(0, 480, canvas.width, canvas.height - 480);
            ctx.strokeStyle = '#222538';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 480, canvas.width, canvas.height - 480);

            // Текст Лобби
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '24px sans-serif';
            ctx.fillText("БЕЗОПАСНОЕ ЛОББИ", canvas.width / 2 - 110, canvas.height - 40);

            // Портал начала матча в Лобби
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 530, 35, 0, Math.PI * 2);
            ctx.fillStyle = matchActive ? '#441122' : '#00adb5';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '11px sans-serif';
            ctx.fillText(matchActive ? "ИДЕТ БОЙ" : "В БОЙ!", canvas.width / 2 - 22, 534);

            // Отрисовка ЗОНЫ АРЕНЫ (Сверху)
            ctx.strokeStyle = '#1b1d36';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 450); ctx.stroke();
            }

            // 1. Физика перемещения игрока
            if (player.isAlive) {
                let mx = 0, my = 0;
                const pSpeed = 4.2;
                if (keys.w) my -= pSpeed; if (keys.s) my += pSpeed;
                if (keys.a) mx -= pSpeed; if (keys.d) mx += pSpeed;

                player.x += mx; player.y += my;

                // Ограничения карты
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

                // Проверка входа в портал
                let distToPortal = Math.hypot(player.x - canvas.width / 2, player.y - 530);
                if (distToPortal < 35 + player.radius && !matchActive) {
                    player.inMatch = true;
                    player.x = canvas.width / 2;
                    player.y = 350; // Телепортируем на арену
                    startNewMatch();
                }

                // Логика автоматического определения, на арене ли игрок
                if (player.y < 450) player.inMatch = true;
                else player.inMatch = false;

                if (mx !== 0 || my !== 0) player.angle = Math.atan2(my, mx);
            }

            // 2. Движение Ботов на Арене
            bots.forEach(bot => {
                if (!bot.isAlive) return;

                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.floor(Math.random() * 40) + 20;
                    bot.moveX = (Math.random() - 0.5) * 3.5;
                    bot.moveY = (Math.random() - 0.5) * 3.5;
                }

                bot.x += bot.moveX; bot.y += bot.moveY;
                bot.x = Math.max(bot.radius, Math.min(canvas.width - bot.radius, bot.x));
                bot.y = Math.max(bot.radius, Math.min(420, bot.y));

                if (bot.moveX !== 0 || bot.moveY !== 0) bot.angle = Math.atan2(bot.moveY, bot.moveX);

                // Автоблок ботов
                let distToBall = Math.hypot(bot.x - ball.x, bot.y - ball.y);
                if (currentTarget === bot && distToBall < (ballSpeed * 12) && !bot.isBlocking) {
                    bot.isBlocking = true;
                    setTimeout(() => {
                        let finalDist = Math.hypot(bot.x - ball.x, bot.y - ball.y);
                        if (finalDist < 55 && currentTarget === bot) {
                            selectNewTarget(bot);
                            ballSpeed += 0.45;
                        }
                        setTimeout(() => { bot.isBlocking = false; }, 200);
                    }, Math.random() * 100 + 40);
                }
            });

            // 3. Физика летящего мяча и шлейфа
            if (currentTarget && matchActive) {
                let angleToTarget = Math.atan2(currentTarget.y - ball.y, currentTarget.x - ball.x);
                ball.x += Math.cos(angleToTarget) * ballSpeed;
                ball.y += Math.sin(angleToTarget) * ballSpeed;

                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 9) ball.trail.shift();

                // Отрисовка кастомного шлейфа
                ball.trail.forEach((t, index) => {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = ballColor;
                    ctx.globalAlpha = index / ball.trail.length * 0.35;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                // Отрисовка мяча
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ballColor;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 4. Столкновение с целями
                let dist = Math.hypot(currentTarget.x - ball.x, currentTarget.y - ball.y);
                if (dist < currentTarget.radius + ball.radius) {
                    if (currentTarget.isPlayer) {
                        if (isBlocking) {
                            score++;
                            coins++; // За каждое успешное парирование получаем +1 монетку в карман!
                            document.getElementById('score').innerText = score;
                            document.getElementById('coins').innerText = coins;
                            ballSpeed += 0.65;
                            selectNewTarget(player);
                        } else {
                            // ИГРОК ВЫБИТ: Он респавнится в лобби, а боты доигрывают раунд!
                            player.isAlive = false;
                            player.inMatch = false;
                            document.getElementById('danger-alert').style.display = 'none';
                            selectNewTarget(player); 
                            
                            setTimeout(() => {
                                player.isAlive = true;
                                player.x = canvas.width / 2;
                                player.y = canvas.height - 80; // Возрождаем в лобби
                            }, 1000);
                        }
                    } else {
                        if (currentTarget.isBlocking) {
                            selectNewTarget(currentTarget);
                        } else {
                            currentTarget.isAlive = false;
                            selectNewTarget();
                        }
                    }
                }
            }

            // Рендер всех живых персонажей
            drawCharacter(player);
            bots.forEach(drawCharacter);

            requestAnimationFrame(update);
        }

        // Автозапуск матча для ботов, если лобби пустое
        setInterval(() => {
            if (!matchActive) startNewMatch();
        }, 3000);

        update();
    </script>
</body>
</html>
