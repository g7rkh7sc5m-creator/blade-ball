<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blade Ball 2D — Mobile & PC Edition</title>
    <style>
        body{margin:0;overflow:hidden;background:#05050f;font-family:'Arial Black',sans-serif;user-select:none;display:flex;justify-content:center;align-items:center;height:100vh;touch-action:none}
        #ui{position:absolute;top:15px;color:#fff;font-size:12px;text-transform:uppercase;pointer-events:none;text-shadow:2px 2px 0 #000;text-align:center;z-index:10;width:100%}
        #instructions{font-size:11px;color:#00adb5;margin-top:5px}     
        #danger-alert{position:absolute;bottom:240px;color:#ff2e63;font-size:26px;display:none;text-shadow:2px 2px 0 #000;animation:blk .3s infinite alternate;font-weight:700;z-index:10;left:50%;transform:translateX(-50%)}
        @keyframes blk{from{opacity:.3}to{opacity:1}}
        #crate-modal{display:none;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(22,25,43,.95);border:4px solid #fee440;border-radius:16px;padding:20px;text-align:center;color:#fff;z-index:20;box-shadow:0 0 30px #000;width:280px}
        #roulette{font-size:22px;font-weight:700;margin:15px 0;color:#00f5d4;padding:10px;background:#111322;border-radius:8px;border:2px dashed #fee440}
        canvas{border:4px solid #16192b;box-shadow:0 0 25px rgba(0,173,181,.2);background:#090a14;max-width:100vw;max-height:100vh}
        
        /* СТИЛИ ДЛЯ МОБИЛЬНОГО УПРАВЛЕНИЯ */
        .mobile-btn{position:absolute;bottom:30px;width:75px;height:75px;border-radius:50%;border:3px solid #fff;color:#fff;font-size:12px;font-weight:bold;display:flex;justify-content:center;align-items:center;z-index:15;box-shadow:0 0 15px rgba(255,255,255,0.3)}
        #btn-block{right:30px;background:rgba(0,255,0,0.6);bottom:120px}
        #btn-ability{right:120px;background:rgba(0,173,181,0.6);bottom:40px}
        #joystick-container{position:absolute;bottom:40px;left:40px;width:120px;height:120px;background:rgba(255,255,255,0.1);border:3px solid rgba(255,255,255,0.3);border-radius:50%;z-index:15;display:flex;justify-content:center;align-items:center}
        #joystick-stick{width:50px;height:50px;background:rgba(255,255,255,0.6);border-radius:50%;box-shadow:0 0 10px #000}
    </style>
</head>
<body>
       <div id="ui">
        МОНЕТЫ: <span id="coins">50</span> | ОРУЖИЕ: <span id="current-weapon">Кулаки</span> | МЯЧ: <span id="current-ball">Дефолт</span> | ЭФФЕКТ: <span id="current-effect">Обычный</span> | СПОСОБНОСТЬ: <span id="current-ability">Рывок</span>
        <div id="alive-counter">СТАТУС: <span id="game-status">В ЛОББИ</span> | БОЙЦОВ: <span id="bots-count">0</span></div>
        <div id="instructions">WASD — бег | ПРОБЕЛ — блок | SHIFT — ульта | Наступи на кейс в лобби!</div>
    </div>
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>
    <div id="crate-modal"><h2 id="crate-title">КЕЙС</h2><div id="roulette">Крутим...</div></div>
    <canvas id="gameCanvas"></canvas>

    <!-- МОБИЛЬНЫЕ ЭЛЕМЕНТЫ НА ЭКРАНЕ -->
    <div id="joystick-container"><div id="joystick-stick"></div></div>
    <div id="btn-block" class="mobile-btn">БЛОК</div>
    <div id="btn-ability" class="mobile-btn">УЛЬТА</div>

    <script>
        const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');canvas.width=800;canvas.height=700;
        let coins=150,score=0,ballColor='#ff0055',currentWeapon='Кулаки',currentKillEffect='default',currentAbility='dash',isOpeningCrate=false,pParts=[],dParts=[],lastHitTime=0;
        const ballSkins=[{name:'🔴 Дефолт',color:'#ff0055'},{name:'🟢 Кислота',color:'#00ff00'},{name:'🔵 Океан',color:'#00adb5'},{name:'🟣 Магия',color:'#9b5de5'},{name:'🟡 ГОЛДА!',color:'#fee440'}];
        const weapons=[{name:'⚔️ Световой Меч',color:'#00ff00',type:'sword'},{name:'🪓 Топор Голды',color:'#fee440',type:'axe'},{name:'🍌 Банан-Убийца',color:'#f15bb5',type:'banana'},{name:'🔱 Трезубец',color:'#00adb5',type:'spear'}];
        const killEffects=[{name:'💥 Взрыв',type:'fire'},{name:'⚡ Молния',type:'lightning'},{name:'🌌 Пустота',type:'void'}];
        const abilities=[{name:'🏃 Рывок',type:'dash'},{name:'⚡ Телекинез',type:'tele'},{name:'🛡️ Супер-Щит',type:'shield'},{name:'👁️ Инвиз',type:'invis'},{name:'⏱️ Замедление',type:'slow'},{name:'🧲 Магнит',type:'magnet'},{name:'🌪️ Вихрь',type:'vortex'},{name:'🧬 Клон',type:'clone'},{name:'☄️ Метеор',type:'meteor'},{name:'🔋 Перезарядка',type:'swap'}];
        let ballSpeed=5,isBlocking=false,bCD=false,dCD=false,keys={w:false,a:false,s:false,d:false},wAngle=0,bots=[],mActive=false,currentTarget=null;
        const botColors=['#9b5de5','#f15bb5','#00f5d4'],ball={x:400,y:180,radius:12},player={x:400,y:660,radius:20,color:'#00adb5',isAlive:true,isPlayer:true,angle:0,inMatch:false,weaponData:null,abilityData:{name:'🏃 Рывок',type:'dash'}};
        let invisActive=false, shieldActive=false, slowActive=false, mobileMove={x:0,y:0};    
        // === АВТОСОХРАНЕНИЕ И СИСТЕМЫ ЧАСТИЦ ===
        function saveProgress(){localStorage.setItem('bb_save_v2',JSON.stringify({coins,currentWeapon,currentKillEffect,currentAbility,weaponData:player.weaponData,ballColor}))}
        function loadProgress(){const s=localStorage.getItem('bb_save_v2');if(s){const d=JSON.parse(s);coins=d.coins||0;currentWeapon=d.currentWeapon||'Кулаки';currentKillEffect=d.currentKillEffect||'default';currentAbility=d.currentAbility||'dash';player.weaponData=d.weaponData||null;ballColor=d.ballColor||'#ff0055';document.getElementById('coins').innerText=coins;document.getElementById('current-weapon').innerText=currentWeapon;let e=killEffects.find(x=>x.type===currentKillEffect);document.getElementById('current-effect').innerText=e?e.name:'Обычный';let a=abilities.find(x=>x.type===currentAbility);player.abilityData=a||{name:'🏃 Рывок',type:'dash'};document.getElementById('current-ability').innerText=player.abilityData.name}}

        function cDeath(x,y,t){
            if (dParts.length > 30) dParts = []; 
            let c=['#ff4500','#ff8c00','#fee440']; if(t==='lightning')c=['#00ffff','#ffffff'];if(t==='void')c=['#4b0082','#9400d3'];
            for(let i=0;i<20;i++)dParts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,radius:Math.random()*3+2,color:c[Math.floor(Math.random()*c.length)],alpha:1,decay:0.04});
        }
        function cParry(x,y,t){
            if (pParts.length > 20) pParts = []; 
            let c=['#ffffff','#00ffff'];if(t==='sword')c=['#00ff00','#77ff77','#ffffff'];if(t==='axe')c=['#fee440','#ffaa00','#ffffff'];if(t==='banana')c=['#f15bb5','#fee440','#ffc0cb'];if(t==='spear')c=['#00adb5','#00ffff','#ffffff'];
            for(let i=0;i<10;i++)pParts.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,radius:Math.random()*2+1,color:c[Math.floor(Math.random()*c.length)],alpha:1,decay:0.06});
        }

        // === ЧЕТЫРЕ СУНДУКА И РУЛЕТКА ===
        function openCrate(t){
            if(isOpeningCrate)return;
            let p=t==='ball'?30:(t==='weapon'?50:(t==='ability'?60:75));
            if(coins<p){alert(`Не хватает монет! Надо: ${p} 💰`);return}
            coins-=p;document.getElementById('coins').innerText=coins;isOpeningCrate=true;saveProgress();
            const modal=document.getElementById('crate-modal'),title=document.getElementById('crate-title'),roulette=document.getElementById('roulette');
            title.innerText=t==='ball'?"🔴 СКИНЫ МЯЧА":t==='weapon'?"⚔️ КЕЙС ОРУЖИЯ":t==='ability'?"🌀 КЕЙС СПОСОБНОСТЕЙ":"💥 ЭФФЕКТЫ СМЕРТИ";
            modal.style.display='block';let cnt=0,list=t==='ball'?ballSkins:t==='weapon'?weapons:t==='ability'?abilities:killEffects;
            let iv=setInterval(()=>{
                let item=list[Math.floor(Math.random()*list.length)];roulette.innerText=item.name;cnt++;
                if(cnt>12){
                    clearInterval(iv);modal.style.display='none';isOpeningCrate=false;
                    if(t==='ball')ballColor=item.color;
                    else if(t==='weapon'){currentWeapon=item.name;player.weaponData=item;document.getElementById('current-weapon').innerText=item.name}
                    else if(t==='ability'){currentAbility=item.type;player.abilityData=item;document.getElementById('current-ability').innerText=item.name}
                    else{currentKillEffect=item.type;document.getElementById('current-effect').innerText=item.name}
                    saveProgress();alert(`🎉 ВЫПАЛО: ${item.name}!`);
                }
            },120)}    
        // === ЛОГИКА МАТЧА И НАГРАД ===
        function startNewMatch(){if(mActive)return;mActive=true;ballSpeed=5.5;bots=[];slowActive=false;for(let i=0;i<3;i++)bots.push({x:Math.random()*650+75,y:Math.random()*200+80,radius:20,color:botColors[i],isAlive:true,isBlocking:false,aiTimer:0,moveX:0,moveY:0,angle:0,inMatch:true});ball.x=400;ball.y=180;selectNewTarget(player.inMatch?null:player)}
        function selectNewTarget(ex){let p=[];if(player.isAlive&&player.inMatch&&player!==ex)p.push(player);bots.forEach(b=>{if(b.isAlive)p.push(b)});if(invisActive&&p.length>1)p=p.filter(x=>!x.isPlayer);if(p.length===2&&ex){currentTarget=p.find(x=>x!==ex)}else if(p.length>0){let ts=p.filter(x=>x!==ex);if(ts.length===0)ts=p;currentTarget=ts[Math.floor(Math.random()*ts.length)]}else{currentTarget=null;mActive=false;setTimeout(startNewMatch,3000)}document.getElementById('danger-alert').style.display=(currentTarget===player&&player.isAlive)?'block':'none';updateAlive()}
        function updateAlive(){let c=(player.isAlive&&player.inMatch?1:0)+bots.filter(b=>b.isAlive).length;document.getElementById('bots-count').innerText=c;document.getElementById('game-status').innerText=mActive?"БИТВА":"ОЖИДАНИЕ";if(mActive&&c===1){let w=player.isAlive&&player.inMatch?player:bots.find(b=>b.isAlive);if(w&&w.isPlayer){coins+=15;document.getElementById('coins').innerText=coins;saveProgress();alert("👑 ПОБЕДА! +15 монет!")}mActive=false;currentTarget=null;setTimeout(startNewMatch,3000)}}

        // === ОТРИСОВКА ПЕРСОНАЖЕЙ ===
        function drawCharacter(c){if(!c.isAlive)return;if(c.isPlayer&&invisActive)ctx.globalAlpha=0.25;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);if(currentTarget===c&&mActive){ctx.beginPath();ctx.arc(0,0,c.radius+8,0,Math.PI*2);ctx.lineWidth=3;ctx.strokeStyle=c.isPlayer?'#ff0000':'#ffaa00';ctx.stroke()}if((c.isPlayer&&(isBlocking||shieldActive))||(!c.isPlayer&&c.isBlocking)){ctx.beginPath();ctx.arc(0,0,c.radius+14,-Math.PI/2,Math.PI/2);ctx.lineWidth=4;ctx.strokeStyle=shieldActive?'#00ffff':'rgba(0,255,0,0.6)';ctx.stroke()}ctx.fillStyle=c.color;ctx.fillRect(-5,-c.radius-4,10,8);ctx.fillRect(-5,c.radius-4,10,8);if(c.isPlayer&&player.weaponData){ctx.save();if(isBlocking){ctx.rotate(wAngle);ctx.translate(c.radius-2,-5)}else{ctx.translate(-8,-c.radius-8);ctx.rotate(-Math.PI/4)}let w=player.weaponData;ctx.lineWidth=2;ctx.strokeStyle='#000';if(w.type==='sword'){ctx.fillStyle=w.color;ctx.fillRect(10,-1,32,7)}else if(w.type==='axe'){ctx.fillStyle=w.color;ctx.beginPath();ctx.moveTo(20,-10);ctx.lineTo(32,-14);ctx.lineTo(32,18);ctx.lineTo(20,14);ctx.closePath();ctx.fill();ctx.stroke()}else if(w.type==='banana'){ctx.fillStyle=w.color;ctx.beginPath();ctx.arc(15,0,12,-Math.PI/3,Math.PI/3,false);ctx.lineWidth=6;ctx.strokeStyle=w.color;ctx.stroke()}else if(w.type==='spear'){ctx.fillStyle=w.color;ctx.fillRect(25,-5,3,15);ctx.fillRect(28,1,11,3)}ctx.restore()}ctx.beginPath();ctx.arc(0,0,c.radius,0,Math.PI*2);ctx.fillStyle=c.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.stroke();ctx.beginPath();ctx.arc(2,0,c.radius*.5,0,Math.PI*2);ctx.fillStyle='#ffdbac';ctx.fill();ctx.stroke();if(c.isPlayer){ctx.fillStyle='#ff2e63';ctx.fillRect(-4,-c.radius-2,8,5);ctx.fillRect(-4,c.radius-3,8,5)}ctx.restore();ctx.globalAlpha=1;}

        // === ОБРАБОТКА СЕНСОРНОГО МОБИЛЬНОГО ДЖОЙСТИКА ===
        const jContainer = document.getElementById('joystick-container'), jStick = document.getElementById('joystick-stick');
        let jActive = false, jCenterX = 0, jCenterY = 0;
        jContainer.addEventListener('touchstart', e => { jActive = true; const r = jContainer.getBoundingClientRect(); jCenterX = r.left + r.width/2; jCenterY = r.top + r.height/2; handleJoy(e.touches[0]); });
        jContainer.addEventListener('touchmove', e => { if(jActive) { e.preventDefault(); handleJoy(e.touches[0]); } });
        jContainer.addEventListener('touchend', () => { jActive = false; jStick.style.transform = 'translate(0px, 0px)'; mobileMove = {x:0,y:0}; });
        function handleJoy(t) {
            let dx = t.clientX - jCenterX, dy = t.clientY - jCenterY, dist = Math.hypot(dx, dy), maxDist = 35;
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            jStick.style.transform = `translate(${dx}px, ${dy}px)`; mobileMove = { x: dx/maxDist, y: dy/maxDist };
        }

        // === КЛАВИАТУРА ДЛЯ КОМПЬЮТЕРА (PC) ===
        window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(e.code==='Space')triggerBlock();if(e.code==='ShiftLeft'||e.code==='ShiftRight')triggerAbility();if(k==='w'||e.key==='ArrowUp')keys.w=true;if(k==='s'||e.key==='ArrowDown')keys.s=true;if(k==='a'||e.key==='ArrowLeft')keys.a=true;if(k==='d'||e.key==='ArrowRight')keys.d=true});
         // ЧЕТЫРЕ КЕЙСА В БЕЗОПАСНОЙ СВЯЗКЕ СПРАВА
        const wCrate={x:80,y:600,r:30}, aCrate={x:240,y:600,r:30}, bCrate={x:540,y:600,r:30}, eCrate={x:700,y:600,r:30};

        function update(){
            if(isBlocking && wAngle < Math.PI / 4) { wAngle += 0.15 }
            ctx.fillStyle='#090a14';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#121424';ctx.fillRect(0,480,canvas.width,canvas.height-480);ctx.strokeStyle='#222538';ctx.lineWidth=4;ctx.strokeRect(0,480,canvas.width,canvas.height-480);
            
            ctx.beginPath();ctx.arc(wCrate.x,wCrate.y,wCrate.r,0,Math.PI*2);ctx.fillStyle='#9b5de5';ctx.fill();ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText("⚔️ МЕЧИ (50)",wCrate.x-28,wCrate.y);
            ctx.beginPath();ctx.arc(aCrate.x,aCrate.y,aCrate.r,0,Math.PI*2);ctx.fillStyle='#00adb5';ctx.fill();ctx.fillStyle='#fff';ctx.fillText("🌀 УЛЬТЫ (60)",aCrate.x-28,aCrate.y);
            ctx.beginPath();ctx.arc(bCrate.x,bCrate.y,bCrate.r,0,Math.PI*2);ctx.fillStyle='#fee440';ctx.fill();ctx.fillStyle='#000';ctx.fillText("🔴 МЯЧИ (30)",bCrate.x-28,bCrate.y);
            ctx.beginPath();ctx.arc(eCrate.x,eCrate.y,eCrate.r,0,Math.PI*2);ctx.fillStyle='#ff4500';ctx.fill();ctx.fillStyle='#fff';ctx.fillText("💥 СМЕРТЬ (75)",eCrate.x-33,eCrate.y);
            
            ctx.beginPath();ctx.arc(400,510,32,0,Math.PI*2);ctx.fillStyle=mActive?'#441122':'#00adb5';ctx.fill();ctx.fillStyle='#fff';ctx.fillText(mActive?"ИДЕТ БОЙ":"В БОЙ!",383,514);ctx.strokeStyle='#1b1d36';ctx.lineWidth=1;for(let i=0;i<canvas.width;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,450);ctx.stroke()}
            
            if(player.isAlive&&!isOpeningCrate){
                let mx = mobileMove.x * 4.2 || 0, my = mobileMove.y * 4.2 || 0;
                if(mx === 0 && my === 0) { const pSpd=4.2; if(keys.w)my-=pSpd; if(keys.s)my+=pSpd; if(keys.a)mx-=pSpd; if(keys.d)mx+=pSpd; }
                player.x+=mx;player.y+=my;player.x=Math.max(player.radius,Math.min(canvas.width-player.radius,player.x));player.y=Math.max(player.radius,Math.min(canvas.height-player.radius,player.y));
                if(Math.hypot(player.x-400,player.y-510)<32+player.radius&&!mActive){player.inMatch=true;player.x=400;player.y=350;startNewMatch()}
                if(Math.hypot(player.x-wCrate.x,player.y-wCrate.y)<wCrate.r+player.radius){player.y=wCrate.y+60;openCrate('weapon')}
                if(Math.hypot(player.x-aCrate.x,player.y-aCrate.y)<aCrate.r+player.radius){player.y=aCrate.y+60;openCrate('ability')}
                if(Math.hypot(player.x-bCrate.x,player.y-bCrate.y)<bCrate.r+player.radius){player.y=bCrate.y+60;openCrate('ball')}
                if(Math.hypot(player.x-eCrate.x,player.y-eCrate.y)<eCrate.r+player.radius){player.y=eCrate.y+60;openCrate('effect')}
                player.inMatch=player.y<450;if(mx!==0||my!==0)player.angle=Math.atan2(my,mx);
            }
            bots.forEach(b=>{
                if(!b.isAlive)return;b.aiTimer--;if(b.aiTimer<=0){b.aiTimer=Math.floor(Math.random()*40)+20;b.moveX=(Math.random()-.5)*3.5;b.moveY=(Math.random()-.5)*3.5}b.x+=b.moveX;b.y+=b.moveY;b.x=Math.max(b.radius,Math.min(canvas.width-b.radius,b.x));b.y=Math.max(b.radius,Math.min(420,b.y));if(b.moveX!==0||b.moveY!==0)b.angle=Math.atan2(b.moveY,b.moveX);
                let db=Math.hypot(b.x-ball.x,b.y-ball.y);
                if(currentTarget===b&&db<45&&!b.isBlocking&&mActive&&(Date.now()-lastHitTime>180)){
                    lastHitTime=Date.now();b.isBlocking=true;ballSpeed+=.45;selectNewTarget(b);
                    let a=Math.atan2(b.y-ball.y,b.x-ball.x);ball.x-=Math.cos(a)*(ballSpeed+40);ball.y-=Math.sin(a)*(ballSpeed+40);
                    setTimeout(()=>{b.isBlocking=false},120);
                }
            });
            if(currentTarget&&mActive){
                let at=Math.atan2(currentTarget.y-ball.y,currentTarget.x-ball.x);ball.x+=Math.cos(at)*ballSpeed;ball.y+=Math.sin(at)*ballSpeed;
                ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fillStyle=ballColor;ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
                let dst=Math.hypot(currentTarget.x-ball.x,currentTarget.y-ball.y);
                
                if(dst<(currentTarget.radius+ball.radius+ballSpeed)){
                    if(currentTarget.isPlayer){
                        if((isBlocking||shieldActive)&&(Date.now()-lastHitTime>180)){
                            lastHitTime=Date.now();score++;coins+=3;document.getElementById('score').innerText=coins;ballSpeed+=.65;cParry(ball.x,ball.y,player.weaponData?player.weaponData.type:'normal');selectNewTarget(player);saveProgress();
                            let a=Math.atan2(currentTarget.y-ball.y,currentTarget.x-ball.x);ball.x-=Math.cos(a)*(ballSpeed+40);ball.y-=Math.sin(a)*(ballSpeed+40);
                        }else if(!isBlocking&&!shieldActive&&dst<(currentTarget.radius+ball.radius)){
                            cDeath(player.x,player.y,'fire');player.isAlive=false;player.inMatch=false;document.getElementById('danger-alert').style.display='none';selectNewTarget(player);setTimeout(()=>{player.isAlive=true;player.x=400;player.y=660},1000)}
                    }else{
                        if(currentTarget.isBlocking){selectNewTarget(currentTarget)}
                        else if(dst<(currentTarget.radius+ball.radius)){cDeath(currentTarget.x,currentTarget.y,currentKillEffect);currentTarget.isAlive=false;selectNewTarget(currentTarget)}
                    }
                }
            }
            for(let i=dParts.length-1;i>=0;i--){let p=dParts[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;if(p.alpha<=0){dParts.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.alpha;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.restore()}
            for(let i=pParts.length-1;i>=0;i--){let p=pParts[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;if(p.alpha<=0){pParts.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.alpha;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.restore()}
            drawCharacter(player);bots.forEach(drawCharacter);requestAnimationFrame(update);
        }
        loadProgress();startNewMatch();update();
    </script>
</body>
</html>
