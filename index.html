<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 2D — Safe Storage</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050f; font-family: 'Arial Black', sans-serif; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui { position: absolute; top: 15px; color: white; font-size: 14px; text-transform: uppercase; pointer-events: none; text-shadow: 2px 2px 0px #000; text-align: center; z-index: 10; width: 100%; }
        #instructions { font-size: 11px; color: #00adb5; margin-top: 5px; }
        #danger-alert { position: absolute; bottom: 180px; color: #ff2e63; font-size: 26px; display: none; text-shadow: 2px 2px 0px #000; animation: blk 0.3s infinite alternate; font-weight: bold; z-index: 10; left: 50%; transform: translateX(-50%); }        @keyframes blk { from { opacity: 0.3; } to { opacity: 1; } }
        #crate-modal { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(22, 25, 43, 0.95); border: 4px solid #fee440; border-radius: 16px; padding: 20px; text-align: center; color: white; z-index: 20; box-shadow: 0 0 30px #000; width: 280px; }
        #roulette { font-size: 22px; font-weight: bold; margin: 15px 0; color: #00f5d4; padding: 10px; background: #111322; border-radius: 8px; border: 2px dashed #fee440; }
        canvas { border: 4px solid #16192b; box-shadow: 0 0 25px rgba(0, 173, 181, 0.2); background: #090a14; }
    </style>
</head>
<body>
    <div id="ui">
        МОНЕТЫ: <span id="coins">50</span> | ОРУЖИЕ: <span id="current-weapon">Кулаки</span> | ЭФФЕКТ: <span id="current-effect">Обычный</span>
        <div id="alive-counter">СТАТУС: <span id="game-status">В ЛОББИ</span> | БОЙЦОВ: <span id="bots-count">0</span></div>
        <div id="instructions">WASD — бег | ПРОБЕЛ — блок | SHIFT — рывок | Наступи на кейс в лобби!</div>
    </div>
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>
    <div id="crate-modal"><h2 id="crate-title">КЕЙС</h2><div id="roulette">Крутим...</div></div>
    <canvas id="gameCanvas"></canvas>
    <script>        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); canvas.width = 800; canvas.height = 700;
        let coins = 60, score = 0, ballColor = '#ff0055', currentWeapon = 'Кулаки', currentKillEffect = 'default', isOpeningCrate = false, pParts = [], dParts = [];
        const ballSkins = [{name:'🔴 Дефолт',color:'#ff0055'},{name:'🟢 Кислота',color:'#00ff00'},{name:'🔵 Океан',color:'#00adb5'},{name:'🟣 Магия',color:'#9b5de5'},{name:'🟡 ГОЛДА!',color:'#fee440'}];
        const weapons = [{name:'⚔️ Световой Меч',color:'#00ff00',type:'sword'},{name:'🪓 Топор Голды',color:'#fee440',type:'axe'},{name:'🍌 Банан-Убийца',color:'#f15bb5',type:'banana'},{name:'🔱 Трезубец',color:'#00adb5',type:'spear'}];
        const killEffects = [{name:'💥 Взрыв',type:'fire'},{name:'⚡ Молния',type:'lightning'},{name:'🌌 Пустота',type:'void'},{name:'🍀 Пати',type:'party'}];
        let ballSpeed = 5, isBlocking = false, bCD = false, dCD = false, keys = {w:false,a:false,s:false,d:false}, wAngle = 0, bots = [], mActive = false, currentTarget = null;
        const botColors = ['#9b5de5', '#f15bb5', '#00f5d4'], ball = {x:400,y:180,radius:12,trail:[]}, player = {x:400,y:620,radius:20,color:'#00adb5',isAlive:true,isPlayer:true,angle:0,inMatch:false,weaponData:null};       
        // === СИСТЕМА СОХРАНЕНИЯ ДАННЫХ ===
        function saveProgress() {
            const data = { coins, currentWeapon, currentKillEffect, weaponData: player.weaponData, ballColor };
            localStorage.setItem('bb_save_v1', JSON.stringify(data));
        }
        function loadProgress() {
            const saved = localStorage.getItem('bb_save_v1');
            if (saved) {
                const d = JSON.parse(saved); coins = d.coins || 0; currentWeapon = d.currentWeapon || 'Кулаки'; currentKillEffect = d.currentKillEffect || 'default'; player.weaponData = d.weaponData || null; ballColor = d.ballColor || '#ff0055';
                document.getElementById('coins').innerText = coins; document.getElementById('current-weapon').innerText = currentWeapon;
                let effObj = killEffects.find(e => e.type === currentKillEffect); document.getElementById('current-effect').innerText = effObj ? effObj.name : 'Обычный';
            }
        }        function cDeath(x, y, t) {
            let c = ['#ff4500','#ff8c00','#fee440']; if(t==='lightning') c=['#00ffff','#ffffff']; if(t==='void') c=['#4b0082','#9400d3']; if(t==='party') c=['#ff007f','#00f5d4','#9b5de5'];
            for(let i=0;i<50;i++) dParts.push({x,y,vx:(Math.random()-0.5)*(t==='lightning'?12:6),vy:(Math.random()-0.5)*(t==='lightning'?12:6),radius:Math.random()*4+2,color:c[Math.floor(Math.random()*c.length)],alpha:1,decay:Math.random()*0.02+0.015});
        }
        function cParry(x, y, t) {
            let c = ['#00ff00']; if(t==='axe') c=['#fee440','#ffaa00']; if(t==='banana') c=['#f15bb5']; if(t==='spear') c=['#00adb5'];
            for(let i=0;i<20;i++) pParts.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,radius:Math.random()*3+2,color:c[Math.floor(Math.random()*c.length)],alpha:1,decay:Math.random()*0.03+0.02});
        }

        function openCrate(t) {
            if (isOpeningCrate) return; let p = t === 'ball' ? 30 : (t === 'weapon' ? 50 : 75);
            if (coins < p) { alert(`Не хватает монет! Надо: ${p} 💰`); return; }
            coins -= p; document.getElementById('coins').innerText = coins; isOpeningCrate = true; saveProgress();
            const modal = document.getElementById('crate-modal'); const title = document.getElementById('crate-title'); const roulette = document.getElementById('roulette');
            title.innerText = t==='ball' ? "🔴 СКИНЫ МЯЧА" : (t==='weapon' ? "⚔️ КЕЙС ОРУЖИЯ" : "💥 ЭФФЕКТЫ СМЕРТИ"); modal.style.display = 'block';
            let cnt = 0, list = t==='ball' ? ballSkins : (t==='weapon' ? weapons : killEffects);            let iv = setInterval(() => {
                let item = list[Math.floor(Math.random()*list.length)]; roulette.innerText = item.name; cnt++;
                if (cnt > 12) {
                    clearInterval(iv); modal.style.display = 'none'; isOpeningCrate = false;
                    if(t==='ball') ballColor = item.color;
                    else if(t==='weapon') { currentWeapon = item.name; player.weaponData = item; document.getElementById('current-weapon').innerText = item.name; }
                    else { currentKillEffect = item.type; document.getElementById('current-effect').innerText = item.name; }
                    saveProgress(); alert(`🎉 ВЫПАЛО: ${item.name}!`);
                }
            }, 120);
        }

        function startNewMatch() {
            if (mActive) return; mActive = true; ballSpeed = 5.5; bots = [];
            for (let i = 0; i < 3; i++) bots.push({ x: Math.random()*650+75, y: Math.random()*200+80, radius: 20, color: botColors[i], isAlive: true, isBlocking: false, aiTimer: 0, moveX: 0, moveY: 0, angle: 0, inMatch: true });
            ball.x = 400; ball.y = 180; ball.trail = []; selectNewTarget(player.inMatch ? null : player);
        }
        function selectNewTarget(ex) {
            let p = []; if (player.isAlive && player.inMatch && player !== ex) p.push(player);
            bots.forEach(b => { if (b.isAlive) p.push(b); }); if (p.length === 0 && ex && ex.isAlive && ex.inMatch) p.push(ex);
            if (p.length > 0) { currentTarget = p[Math.floor(Math.random()*p.length)]; document.getElementById('danger-alert').style.display = (currentTarget === player && player.isAlive) ? 'block' : 'none'; }
            else { currentTarget = null; mActive = false; } updateAlive();
        }        function updateAlive() {
            let c = (player.isAlive && player.inMatch ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = c; document.getElementById('game-status').innerText = mActive ? "БИТВА" : "ОЖИДАНИЕ";
            if (mActive && c === 1) { let w = player.isAlive && player.inMatch ? player : bots.find(b => b.isAlive); if (w && w.isPlayer) { coins += 15; document.getElementById('coins').innerText = coins; saveProgress(); alert("👑 ПОБЕДА! +15 монет!"); } mActive = false; currentTarget = null; }
        }

        function drawCharacter(c) {
            if (!c.isAlive) return; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
            if (currentTarget === c && mActive) { ctx.beginPath(); ctx.arc(0,0,c.radius+8,0,Math.PI*2); ctx.lineWidth=3; ctx.strokeStyle=c.isPlayer?'#ff0000':'#ffaa00'; ctx.stroke(); }
            if ((c.isPlayer && isBlocking) || (!c.isPlayer && c.isBlocking)) { ctx.beginPath(); ctx.arc(0,0,c.radius+14,-Math.PI/2,Math.PI/2); ctx.lineWidth=4; ctx.strokeStyle='rgba(0,255,0,0.6)'; ctx.stroke(); }
            ctx.fillStyle = c.color; if ((c.isPlayer && isBlocking) || (!c.isPlayer && c.isBlocking)) { ctx.fillRect(c.radius-5,-15,12,8); ctx.fillRect(c.radius-5,7,12,8); } else { ctx.fillRect(-5,-c.radius-4,10,8); ctx.fillRect(-5,c.radius-4,10,8); }
            if (c.isPlayer && player.weaponData) {
                ctx.save(); if (isBlocking) { ctx.rotate(wAngle); ctx.translate(c.radius-2,-5); } else { ctx.translate(-8,-c.radius-8); ctx.rotate(-Math.PI/4); }
                let w = player.weaponData; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                if (w.type === 'sword') { ctx.fillStyle = '#555'; ctx.fillRect(0,0,10,5); ctx.fillStyle = w.color; ctx.shadowBlur = 12; ctx.shadowColor = w.color; ctx.fillRect(10,-1,32,7); }
                else if (w.type === 'axe') { ctx.fillStyle = '#8B4513'; ctx.fillRect(0,2,28,4); ctx.fillStyle = w.color; ctx.beginPath(); ctx.moveTo(20,-10); ctx.lineTo(32,-14); ctx.lineTo(32,18); ctx.lineTo(20,14); ctx.closePath(); ctx.fill(); ctx.stroke(); }                else if (w.type === 'banana') { ctx.fillStyle = w.color; ctx.beginPath(); ctx.arc(15,0,12,-Math.PI/3,Math.PI/3,false); ctx.lineWidth=6; ctx.strokeStyle=w.color; ctx.stroke(); }
                else if (w.type === 'spear') { ctx.fillStyle = '#777'; ctx.fillRect(0,2,25,3); ctx.fillStyle = w.color; ctx.fillRect(25,-5,3,15); ctx.fillRect(28,-5,8,2); ctx.fillRect(28,1,11,3); }
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(0,0,c.radius,0,Math.PI*2); ctx.fillStyle = c.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
            ctx.beginPath(); ctx.arc(2,0,c.radius*0.5,0,Math.PI*2); ctx.fillStyle = '#ffdbac'; ctx.fill(); ctx.stroke();
            if (c.isPlayer) { ctx.fillStyle = '#ff2e63'; ctx.fillRect(-4,-c.radius-2,8,5); ctx.fillRect(-4,c.radius-3,8,5); }
            ctx.restore();
        }

        window.addEventListener('keydown', (e) => {
            let k = e.key.toLowerCase();
            if (e.code === 'Space' && !bCD && !isBlocking && player.isAlive && player.inMatch) {
                isBlocking = true; bCD = true; wAngle = -Math.PI / 4;
                let sw = setInterval(() => { wAngle += 0.2; if (wAngle >= Math.PI / 4) clearInterval(sw); }, 20);
                setTimeout(() => { isBlocking = false; setTimeout(() => { bCD = false; }, 200); }, 280);
            }
            if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !dCD && player.isAlive) {
                dCD = true; let dx = 0, dy = 0; if (keys.w) dy = -1; if (keys.s) dy = 1; if (keys.a) dx = -1; if (keys.d) dx = 1;
                if (dx === 0 && dy === 0) { dx = Math.cos(player.angle); dy = Math.sin(player.angle); } player.x += dx * 65; player.y += dy * 65; setTimeout(() => { dCD = false; }, 1500);
            }
            if (k === 'w' || e.key === 'ArrowUp') keys.w = true; if (k === 's' || e.key === 'ArrowDown') keys.s = true; if (k === 'a' || e.key === 'ArrowLeft') keys.a = true; if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            let k = e.key.toLowerCase(); if (k === 'w' || e.key === 'ArrowUp') keys.w = false; if (k === 's' || e.key === 'ArrowDown') keys.s = false; if (k === 'a' || e.key === 'ArrowLeft') keys.a = false; if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
        });    const wCrate = { x: 120, y: 600, r: 35 }, bCrate = { x: 540, y: 600, r: 35 }, eCrate = { x: 690, y: 600, r: 35 };
        
        function update() {
            ctx.fillStyle = '#090a14'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#121424'; ctx.fillRect(0, 480, canvas.width, canvas.height - 480);
            ctx.strokeStyle = '#222538'; ctx.lineWidth = 4; ctx.strokeRect(0, 480, canvas.width, canvas.height - 480);

            ctx.beginPath(); ctx.arc(wCrate.x, wCrate.y, wCrate.r, 0, Math.PI*2); ctx.fillStyle = '#9b5de5'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.fillText("⚔️ МЕЧИ (50)", wCrate.x - 30, wCrate.y);
            ctx.beginPath(); ctx.arc(bCrate.x, bCrate.y, bCrate.r, 0, Math.PI*2); ctx.fillStyle = '#fee440'; ctx.fill(); ctx.fillStyle = '#000'; ctx.fillText("🔴 МЯЧИ (30)", bCrate.x - 30, bCrate.y);
            ctx.beginPath(); ctx.arc(eCrate.x, eCrate.y, eCrate.r, 0, Math.PI*2); ctx.fillStyle = '#ff4500'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText("💥 СМЕРТЬ (75)", eCrate.x - 35, eCrate.y);

            ctx.beginPath(); ctx.arc(400, 510, 32, 0, Math.PI*2); ctx.fillStyle = mActive ? '#441122' : '#00adb5'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(mActive ? "ИДЕТ БОЙ" : "В БОЙ!", 383, 514);
            ctx.strokeStyle = '#1b1d36'; ctx.lineWidth = 1; for (let i = 0; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,450); ctx.stroke(); }

            if (player.isAlive && !isOpeningCrate) {
                let mx = 0, my = 0; const pSpd = 4.2; if (keys.w) my -= pSpd; if (keys.s) my += pSpd; if (keys.a) mx -= pSpd; if (keys.d) mx += pSpd;
                player.x += mx; player.y += my; player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x)); player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
                if (Math.hypot(player.x - 400, player.y - 510) < 32 + player.radius && !mActive) { player.inMatch = true; player.x = 400; player.y = 350; startNewMatch(); }
                if (Math.hypot(player.x - wCrate.x, player.y - wCrate.y) < wCrate.r + player.radius) { player.y = wCrate.y + 60; openCrate('weapon'); }
                if (Math.hypot(player.x - bCrate.x, player.y - bCrate.y) < bCrate.r + player.radius) { player.y = bCrate.y + 60; openCrate('ball'); }
                if (Math.hypot(player.x - eCrate.x, player.y - eCrate.y) < eCrate.r + player.radius) { player.y = eCrate.y + 60; openCrate('effect'); }
                player.inMatch = player.y < 450; if (mx !== 0 || my !== 0) player.angle = Math.atan2(my, mx);
            }            bots.forEach(b => {
                if (!b.isAlive) return; b.aiTimer--; if (b.aiTimer <= 0) { b.aiTimer = Math.floor(Math.random()*40)+20; b.moveX = (Math.random()-0.5)*3.5; b.moveY = (Math.random()-0.5)*3.5; }
                b.x += b.moveX; b.y += b.moveY; b.x = Math.max(b.radius, Math.min(canvas.width - b.radius, b.x)); b.y = Math.max(b.radius, Math.min(420, b.y));
                if (b.moveX !== 0 || b.moveY !== 0) b.angle = Math.atan2(b.moveY, b.moveX);
                let db = Math.hypot(b.x - ball.x, b.y - ball.y);
                if (currentTarget === b && db < (ballSpeed * 12) && !b.isBlocking) {
                    b.isBlocking = true; setTimeout(() => { if (Math.hypot(b.x - ball.x, b.y - ball.y) < 55 && currentTarget === b && mActive) { selectNewTarget(b); ballSpeed += 0.45; } setTimeout(() => { b.isBlocking = false; }, 200); }, Math.random()*100+40);
                }
            });

            if (currentTarget && mActive) {
                let at = Math.atan2(currentTarget.y - ball.y, currentTarget.x - ball.x); ball.x += Math.cos(at) * ballSpeed; ball.y += Math.sin(at) * ballSpeed;
                ball.trail.push({x:ball.x,y:ball.y}); if (ball.trail.length > 9) ball.trail.shift();
                ball.trail.forEach((t, i) => { ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * (i / ball.trail.length), 0, Math.PI*2); ctx.fillStyle = ballColor; ctx.globalAlpha = i / ball.trail.length * 0.35; ctx.fill(); ctx.globalAlpha = 1; });
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = ballColor; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                let dst = Math.hypot(currentTarget.x - ball.x, currentTarget.y - ball.y);
                if (dst < currentTarget.radius + ball.radius) {
                    if (currentTarget.isPlayer) {
                        if (isBlocking) { score++; coins += 3; document.getElementById('score').innerText = score; document.getElementById('coins').innerText = coins; ballSpeed += 0.65; cParry(ball.x, ball.y, player.weaponData ? player.weaponData.type : 'normal'); selectNewTarget(player); saveProgress(); } 
                        else { cDeath(player.x, player.y, 'fire'); player.isAlive = false; player.inMatch = false; document.getElementById('danger-alert').style.display = 'none'; selectNewTarget(player); setTimeout(() => { player.isAlive = true; player.x = 400; player.y = 620; }, 1000); }
                    } else { if (currentTarget.isBlocking) { selectNewTarget(currentTarget); } else { cDeath(currentTarget.x, currentTarget.y, currentKillEffect); currentTarget.isAlive = false; selectNewTarget(currentTarget); } }
                }
            }

            for (let i = dParts.length - 1; i >= 0; i--) { let p = dParts[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; if (p.alpha <= 0) { dParts.splice(i, 1); continue; } ctx.save(); ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); ctx.restore(); }
            for (let i = pParts.length - 1; i >= 0; i--) { let p = pParts[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; if (p.alpha <= 0) { pParts.splice(i, 1); continue; } ctx.save(); ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); ctx.restore(); }
            drawCharacter(player); bots.forEach(drawCharacter); requestAnimationFrame(update);
        }

        loadProgress(); setInterval(() => { if (!mActive) startNewMatch(); }, 3000); update();
    </script>
</body>
</html>
