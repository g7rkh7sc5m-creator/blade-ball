<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 2D — Crates & Weapons Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050f; font-family: 'Arial Black', sans-serif; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui {
            position: absolute; top: 15px; color: white; font-size: 18px; text-transform: uppercase; pointer-events: none;
            text-shadow: 3px 3px 0px #000; text-align: center; z-index: 10; letter-spacing: 1px; width: 100%;
        }
        #instructions { font-size: 11px; color: #00adb5; margin-top: 5px; }
        #danger-alert { 
            position: absolute; bottom: 180px; color: #ff2e63; font-size: 28px; display: none; text-shadow: 2px 2px 0px #000;
            animation: blink 0.3s infinite alternate; font-weight: bold; z-index: 10; left: 50%; transform: translateX(-50%);
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
        
        /* Окно открытия Кейса */
        #crate-modal {
            display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(22, 25, 43, 0.95); border: 4px solid #fee440; border-radius: 16px;
            padding: 20px; text-align: center; color: white; z-index: 20; box-shadow: 0 0 30px #000; width: 300px;
        }
        #roulette {
            font-size: 24px; font-weight: bold; margin: 20px 0; color: #00f5d4;
            padding: 10px; background: #111322; border-radius: 8px; border: 2px dashed #fee440;
        }
        canvas { border: 4px solid #16192b; box-shadow: 0 0 25px rgba(0, 173, 181, 0.2); background: #090a14; }
    </style>
</head>
<body>

    <div id="ui">
        МОНЕТЫ: <span id="coins">0</span> | ИНВЕНТАРЬ: <span id="current-weapon">Кулаки</span>
        <div id="alive-counter">СТАТУС: <span id="game-status">В ЛОББИ</span> | ЖИВЫХ БОЙЦОВ: <span id="bots-count">0</span></div>
        <div id="instructions">WASD — бег | ПРОБЕЛ — блок | SHIFT — рывок | В ЛОББИ: Наступи на кейсы для открытия!</div>
    </div>
    
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>

    <!-- Всплывающее окно кейса -->
    <div id="crate-modal">
        <h2 id="crate-title">ОТКРЫТИЕ КЕЙСА</h2>
        <div id="roulette">Крутим...</div>
        <div style="font-size: 12px; color: #aaa;">Удача улыбается тебе!</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 700;

        // Экономика
        let coins = 25; // Дадим 25 монет на старте для тестов кейсов!
        document.getElementById('coins').innerText = coins;
        
        let score = 0;
        let ballColor = '#ff0055';
        let currentWeapon = 'Кулаки';
        let isOpeningCrate = false;

        // Дроп-листы кейсов
        const ballSkins = [
            { name: '🔴 Дефолт', color: '#ff0055' },
            { name: '🟢 Кислота', color: '#00ff00' },
            { name: '🔵 Океан', color: '#00adb5' },
            { name: '🟣 Магия', color: '#9b5de5' },
            { name: '🟡 ГОЛДА!', color: '#fee440' }
        ];

        const weapons = [
            { name: '⚔️ Световой Меч', color: '#00ff00', type: 'sword' },
            { name: '🪓 Топор Голды', color: '#fee440', type: 'axe' },
            { name: '🍌 Банан-Убийца', color: '#f15bb5', type: 'banana' },
            { name: '🔱 Трезубец', color: '#00adb5', type: 'spear' }
        ];

        let ballSpeed = 5;
        let isBlocking = false; let blockCooldown = false; let dashCooldown = false;
        let keys = { w: false, a: false, s: false, d: false };

        const player = { x: canvas.width / 2, y: canvas.height - 80, radius: 20, color: '#00adb5', isAlive: true, isPlayer: true, angle: 0, inMatch: false };
        let bots = [];
        const botColors = ['#9b5de5', '#f15bb5', '#00f5d4'];
        let matchActive = false;

        const ball = { x: canvas.width / 2, y: 180, radius: 12, trail: [] };
        let currentTarget = null;

        // ФУНКЦИЯ ОТКРЫТИЯ КЕЙСА (Руллетка)
        function openCrate(type) {
            if (isOpeningCrate) return;
            
            let price = type === 'ball' ? 10 : 15;
            if (coins < price) {
                alert("Не хватает монет! Отбивай мяч на Арене!");
                return;
            }
            
            coins -= price;
            document.getElementById('coins').innerText = coins;
            isOpeningCrate = true;
            
            const modal = document.getElementById('crate-modal');
            const title = document.getElementById('crate-title');
            const roulette = document.getElementById('roulette');
            
            title.innerText = type === 'ball' ? "КЕЙС СКИНОВ МЯЧА" : "КЕЙС ОРУЖИЯ ПАРИРОВАНИЯ";
            modal.style.display = 'block';

            let counter = 0;
            let list = type === 'ball' ? ballSkins : weapons;
            
            let interval = setInterval(() => {
                let randomItem = list[Math.floor(Math.random() * list.length)];
                roulette.innerText = randomItem.name;
                counter++;
                
                if (counter > 10) {
                    clearInterval(interval);
                    setTimeout(() => {
                        modal.style.display = 'none';
                        isOpeningCrate = false;
                        
                        if (type === 'ball') {
                            ballColor = randomItem.color;
                            alert(`🎉 ВЫПАЛ СКИН МЯЧА: ${randomItem.name}! Теперь твой мяч этого цвета.`);
                        } else {
                            currentWeapon = randomItem.name;
                            player.weaponData = randomItem;
                            document.getElementById('current-weapon').innerText = randomItem.name;
                            alert(`🎉 ВЫПАЛО ОРУЖИЕ: ${randomItem.name}! Твой человечек взял его в руку.`);
                        }
                    }, 500);
                }
            }, 150);
        }

        function startNewMatch() {
            if (matchActive) return; matchActive = true; ballSpeed = 5.5;
            bots = [];
            for (let i = 0; i < 3; i++) {
                bots.push({
                    x: Math.random() * (canvas.width - 150) + 75, y: Math.random() * 200 + 80,
                    radius: 20, color: botColors[i], isAlive: true, isPlayer: false, isBlocking: false,
                    aiTimer: 0, moveX: 0, moveY: 0, angle: 0, inMatch: true
                });
            }
            ball.x = canvas.width / 2; ball.y = 180; ball.trail = [];
            selectNewTarget(player.inMatch ? null : player);
        }

        function selectNewTarget(exception) {
            let pool = [];
            if (player.isAlive && player.inMatch && player !== exception) pool.push(player);
            bots.forEach(b => { if (b.isAlive) pool.push(b); });
            if (pool.length === 0 && exception && exception.isAlive && exception.inMatch) pool.push(exception);

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('danger-alert').style.display = (currentTarget === player && player.isAlive) ? 'block' : 'none';
            } else { currentTarget = null; matchActive = false; }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = (player.isAlive && player.inMatch ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            document.getElementById('game-status').innerText = matchActive ? "БИТВА" : "ОЖИДАНИЕ";
            if (matchActive && count === 1) {
                let winner = player.isAlive && player.inMatch ? player : bots.find(b => b.isAlive);
                if (winner && winner.isPlayer) { coins += 8; document.getElementById('coins').innerText = coins; alert("👑 ПОБЕДА! +8 монет за топ-1!"); }
                matchActive = false; currentTarget = null;
            }
        }

        function drawCharacter(char) {
            if (!char.isAlive) return;
            ctx.save(); ctx.translate(char.x, char.y); ctx.rotate(char.angle);

            if (currentTarget === char && matchActive) {
                ctx.beginPath(); ctx.arc(0, 0, char.radius + 8, 0, Math.PI * 2); ctx.lineWidth = 3;
                ctx.strokeStyle = char.isPlayer ? '#ff0000' : '#ffaa00'; ctx.stroke();
            }
            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.beginPath(); ctx.arc(0, 0, char.radius + 12, -Math.PI/3, Math.PI/3); ctx.lineWidth = 5; ctx.strokeStyle = '#00ff00'; ctx.stroke();
            }

            ctx.fillStyle = char.color;
            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.fillRect(char.radius - 5, -15, 12, 8); ctx.fillRect(char.radius - 5, 7, 12, 8);
            } else { ctx.fillRect(-5, -char.radius - 4, 10, 8); ctx.fillRect(-5, char.radius - 4, 10, 8); }

            // ТЕЛО И ГОЛОВА
            ctx.beginPath(); ctx.arc(0, 0, char.radius, 0, Math.PI * 2); ctx.fillStyle = char.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
            ctx.beginPath(); ctx.arc(2, 0, char.radius * 0.5, 0, Math.PI * 2); ctx.fillStyle = '#ffdbac'; ctx.fill(); ctx.stroke();

            if (char.isPlayer) {
                // Наушники агента
                ctx.fillStyle = '#ff2e63'; ctx.fillRect(-4, -char.radius - 2, 8, 5); ctx.fillRect(-4, char.radius - 3, 8, 5);
                ctx.beginPath(); ctx.arc(-2, 0, char.radius + 1, -Math.PI/2, Math.PI/2, true); ctx.lineWidth = 2; ctx.strokeStyle = '#ff2e63'; ctx.stroke();

                // ОТРИСОВКА ВЫПАВШЕГО ИЗ КЕЙСА ОРУЖИЯ В РУКЕ ИГРОКА!
                if (player.weaponData) {
                    ctx.fillStyle = player.weaponData.color;
                    if (isBlocking) {
                        ctx.fillRect(char.radius + 5, -5, 25, 6); // Меч выставлен вперед при ударе!
                    } else {
                        ctx.fillRect(char.radius - 4, -18, 6, 15); // Меч поднят вверх в спокойном состоянии
                    }
                }
            }
            ctx.restore();
        }        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (e.code === 'Space' && !blockCooldown && !isBlocking && player.isAlive && player.inMatch) {
                isBlocking = true; blockCooldown = true;
                setTimeout(() => { isBlocking = false; setTimeout(() => { blockCooldown = false; }, 200); }, 280);
            }
            if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !dashCooldown && player.isAlive) {
                dashCooldown = true;
                let dx = 0, dy = 0;
                if (keys.w) dy = -1; if (keys.s) dy = 1; if (keys.a) dx = -1; if (keys.d) dx = 1;
                if (dx === 0 && dy === 0) { dx = Math.cos(player.angle); dy = Math.sin(player.angle); }
                player.x += dx * 65; player.y += dy * 65;
                setTimeout(() => { dashCooldown = false; }, 1500);
            }
            if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // Кейсы в Лобби (Координаты сундуков)
        const weaponCratePos = { x: 150, y: 600, r: 35 };
        const ballCratePos = { x: 650, y: 600, r: 35 };

        function update() {
            ctx.fillStyle = '#090a14'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ЛОББИ (Низ карты)
            ctx.fillStyle = '#121424'; ctx.fillRect(0, 480, canvas.width, canvas.height - 480);
            ctx.strokeStyle = '#222538'; ctx.lineWidth = 4; ctx.strokeRect(0, 480, canvas.width, canvas.height - 480);

            // 📦 Отрисовка КЕЙСА ОРУЖИЯ (Слева в лобби)
            ctx.beginPath(); ctx.arc(weaponCratePos.x, weaponCratePos.y, weaponCratePos.r, 0, Math.PI * 2);
            ctx.fillStyle = '#9b5de5'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText("⚔️ КЕЙС МЕЧЕЙ", weaponCratePos.x - 38, weaponCratePos.y - 2);
            ctx.fillText("ЦЕНА: 15", weaponCratePos.x - 22, weaponCratePos.y + 14);

            // 📦 Отрисовка КЕЙСА СКИНОВ МЯЧА (Справа в лобби)
            ctx.beginPath(); ctx.arc(ballCratePos.x, ballCratePos.y, ballCratePos.r, 0, Math.PI * 2);
            ctx.fillStyle = '#fee440'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.fillStyle = '#000'; ctx.font = '11px sans-serif'; ctx.fillText("🔴 КЕЙС МЯЧЕЙ", ballCratePos.x - 38, ballCratePos.y - 2);
            ctx.fillText("ЦЕНА: 10", ballCratePos.x - 22, ballCratePos.y + 14);

            // Портал "В БОЙ" (Центр лобби)
            ctx.beginPath(); ctx.arc(canvas.width / 2, 550, 35, 0, Math.PI * 2);
            ctx.fillStyle = matchActive ? '#441122' : '#00adb5'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.fillText(matchActive ? "ИДЕТ БОЙ" : "В БОЙ!", canvas.width / 2 - 20, 554);

            // Сетка Арены (Верх карты)
            ctx.strokeStyle = '#1b1d36'; ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 450); ctx.stroke(); }

            // Движение игрока и проверка наступания на Кейсы
            if (player.isAlive && !isOpeningCrate) {
                let mx = 0, my = 0; const pSpeed = 4.2;
                if (keys.w) my -= pSpeed; if (keys.s) my += pSpeed; if (keys.a) mx -= pSpeed; if (keys.d) mx += pSpeed;
                player.x += mx; player.y += my;
                player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

                // 1. Проверка: Наступил на портал "В БОЙ!"
                if (Math.hypot(player.x - canvas.width / 2, player.y - 550) < 35 + player.radius && !matchActive) {
                    player.inMatch = true; player.x = canvas.width / 2; player.y = 350; startNewMatch();
                }
                // 2. Проверка: Наступил на Кейс Оружия
                if (Math.hypot(player.x - weaponCratePos.x, player.y - weaponCratePos.y) < weaponCratePos.r + player.radius) {
                    player.y = weaponCratePos.y + 60; openCrate('weapon');
                }
                // 3. Проверка: Наступил на Кейс Мячей
                if (Math.hypot(player.x - ballCratePos.x, player.y - ballCratePos.y) < ballCratePos.r + player.radius) {
                    player.y = ballCratePos.y + 60; openCrate('ball');
                }

                player.inMatch = player.y < 450;
                if (mx !== 0 || my !== 0) player.angle = Math.atan2(my, mx);
            }

            // Движение ботов
            bots.forEach(bot => {
                if (!bot.isAlive) return;
                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.floor(Math.random() * 40) + 20;
                    bot.moveX = (Math.random() - 0.5) * 3.5; bot.moveY = (Math.random() - 0.5) * 3.5;
                }
                bot.x += bot.moveX; bot.y += bot.moveY;
                bot.x = Math.max(bot.radius, Math.min(canvas.width - bot.radius, bot.x));
                bot.y = Math.max(bot.radius, Math.min(420, bot.y));
                if (bot.moveX !== 0 || bot.moveY !== 0) bot.angle = Math.atan2(bot.moveY, bot.moveX);

                let distToBall = Math.hypot(bot.x - ball.x, bot.y - ball.y);
                if (currentTarget === bot && distToBall < (ballSpeed * 12) && !bot.isBlocking) {
                    bot.isBlocking = true;
                    setTimeout(() => {
                        if (Math.hypot(bot.x - ball.x, bot.y - ball.y) < 55 && currentTarget === bot) { selectNewTarget(bot); ballSpeed += 0.45; }
                        setTimeout(() => { bot.isBlocking = false; }, 200);
                    }, Math.random() * 100 + 40);
                }
            });

            // Мяч и коллизии
            if (currentTarget && matchActive) {
                let angleToTarget = Math.atan2(currentTarget.y - ball.y, currentTarget.x - ball.x);
                ball.x += Math.cos(angleToTarget) * ballSpeed; ball.y += Math.sin(angleToTarget) * ballSpeed;
                ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 9) ball.trail.shift();

                ball.trail.forEach((t, index) => {
                    ctx.beginPath(); ctx.arc(t.x, t.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = ballColor; ctx.globalAlpha = index / ball.trail.length * 0.35; ctx.fill(); ctx.globalAlpha = 1;
                });

                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = ballColor; ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

                let dist = Math.hypot(currentTarget.x - ball.x, currentTarget.y - ball.y);
                if (dist < currentTarget.radius + ball.radius) {
                    if (currentTarget.isPlayer) {
                        if (isBlocking) {
                            score++; coins += 2; // Оружие дает больше денег! +2 за отбив!
                            document.getElementById('score').innerText = score; document.getElementById('coins').innerText = coins;
                            ballSpeed += 0.65; selectNewTarget(player);
                        } else {
                            player.isAlive = false; player.inMatch = false;
                            document.getElementById('danger-alert').style.display = 'none';
                            selectNewTarget(player);
                            setTimeout(() => { player.isAlive = true; player.x = canvas.width / 2; player.y = canvas.height - 80; }, 1000);
                        }
                    } else {
                        if (currentTarget.isBlocking) { selectNewTarget(currentTarget); } 
                        else { currentTarget.isAlive = false; selectNewTarget(); }
                    }
                }
            }

            drawCharacter(player); bots.forEach(drawCharacter);
            requestAnimationFrame(update);
        }

        setInterval(() => { if (!matchActive) startNewMatch(); }, 3000);
        update();
    </script>
</body>
</html>
