<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 2D — Brawl Stars Style</title>
    <style>
        body { margin: 0; overflow: hidden; background: #070714; font-family: 'Arial Black', sans-serif; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #ui {
            position: absolute; top: 20px; color: white; font-size: 24px; text-transform: uppercase; pointer-events: none;
            text-shadow: 3px 3px 0px #000; text-align: center; z-index: 10; letter-spacing: 1px; width: 100%;
        }
        #instructions { font-size: 13px; color: #00adb5; margin-top: 5px; text-shadow: 1px 1px 0px #000; }
        #alive-counter { font-size: 18px; color: #ff2e63; margin-top: 5px; }
        #danger-alert { 
            position: absolute; bottom: 40px; color: #ff2e63; font-size: 28px; display: none; text-shadow: 2px 2px 0px #000;
            animation: blink 0.3s infinite alternate; font-weight: bold; z-index: 10;
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
        canvas { border: 4px solid #16192b; box-shadow: 0 0 20px rgba(0, 173, 181, 0.3); background: #111322; }
    </style>
</head>
<body>

    <div id="ui">
        ОТБИТО: <span id="score">0</span>
        <div id="alive-counter">ОСТАЛОСЬ БОЙЦОВ: <span id="bots-count">4</span></div>
        <div id="instructions">WASD / Стрелки — бег | ПРОБЕЛ — блок / парирование</div>
    </div>
    
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>

    <canvas id="gameCanvas"></canvas>

    <script>        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.min(window.innerWidth, 800);
        canvas.height = Math.min(window.innerHeight, 600);

        let score = 0;
        let ballSpeed = 5;
        let isBlocking = false;
        let blockCooldown = false;
        let keys = { w: false, a: false, s: false, d: false };

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            radius: 20,
            color: '#00adb5',
            isAlive: true,
            isPlayer: true,
            angle: 0
        };

        let bots = [];
        const botColors = ['#9b5de5', '#f15bb5', '#00f5d4', '#fee440'];
        
        function createBots() {
            bots = [];
            for (let i = 0; i < 3; i++) {
                bots.push({
                    x: Math.random() * (canvas.width - 100) + 50,
                    y: Math.random() * (canvas.height / 2) + 50,
                    radius: 20,
                    color: botColors[i],
                    isAlive: true,
                    isPlayer: false,
                    isBlocking: false,
                    aiTimer: 0,
                    moveX: 0,
                    moveY: 0,
                    angle: 0
                });
            }
        }

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            color: '#ff0055',
            trail: []
        };

        let currentTarget = player;

        function selectNewTarget(exception) {
            let pool = [];
            if (player.isAlive && player !== exception) pool.push(player);
            bots.forEach(b => { if (b.isAlive && b !== exception) pool.push(b); });

            if (pool.length === 0 && exception && exception.isAlive) pool.push(exception);

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('danger-alert').style.display = currentTarget === player ? 'block' : 'none';
            } else {
                currentTarget = null;
            }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = (player.isAlive ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            
            if (count === 1 && player.isAlive) {
                alert("👑 ПОБЕДА СТИЛЯ BRAWL STARS! Вы выбили всех ботов!");
                restartGame();
            }
        }

        function restartGame() {
            player.isAlive = true;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            createBots();
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 3;
            ballSpeed = 5;
            score = 0;
            document.getElementById('score').innerText = score;
            selectNewTarget();
        }

        function drawCharacter(char) {
            if (!char.isAlive) return;

            ctx.save();
            ctx.translate(char.x, char.y);
            ctx.rotate(char.angle);

            if (currentTarget === char) {
                ctx.beginPath();
                ctx.arc(0, 0, char.radius + 8, 0, Math.PI * 2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = char.isPlayer ? '#ff0000' : '#ffaa00';
                ctx.stroke();
            }

            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.beginPath();
                ctx.arc(0, 0, char.radius + 12, -Math.PI/3, Math.PI/3);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#00ff00';
                ctx.stroke();
            }

            ctx.fillStyle = char.color;
            if ((char.isPlayer && isBlocking) || (!char.isPlayer && char.isBlocking)) {
                ctx.fillRect(char.radius - 5, -15, 12, 8);
                ctx.fillRect(char.radius - 5, 7, 12, 8);
            } else {
                ctx.fillRect(-5, -char.radius - 4, 10, 8);
                ctx.fillRect(-5, char.radius - 4, 10, 8);
            }

            ctx.beginPath();
            ctx.arc(0, 0, char.radius, 0, Math.PI * 2);
            ctx.fillStyle = char.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(2, 0, char.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffdbac';
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            if (e.code === 'Space') {
                if (!blockCooldown && !isBlocking && player.isAlive) {
                    isBlocking = true;
                    blockCooldown = true;
                    setTimeout(() => {
                        isBlocking = false;
                        setTimeout(() => { blockCooldown = false; }, 200);
                    }, 300);
                }
            }
            if (key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            let key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        function update() {
            ctx.fillStyle = '#111322';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1b1d36';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            if (player.isAlive) {
                let mx = 0, my = 0;
                const pSpeed = 4.5;
                if (keys.w && player.y > player.radius) my -= pSpeed;
                if (keys.s && player.y < canvas.height - player.radius) my += pSpeed;
                if (keys.a && player.x > player.radius) mx -= pSpeed;
                if (keys.d && player.x < canvas.width - player.radius) mx += pSpeed;

                player.x += mx;
                player.y += my;

                if (mx !== 0 || my !== 0) {
                    player.angle = Math.atan2(my, mx);
                }
            }

            bots.forEach(bot => {
                if (!bot.isAlive) return;

                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.floor(Math.random() * 40) + 20;
                    bot.moveX = (Math.random() - 0.5) * 3;
                    bot.moveY = (Math.random() - 0.5) * 3;
                }

                bot.x += bot.moveX;
                bot.y += bot.moveY;

                bot.x = Math.max(bot.radius, Math.min(canvas.width - bot.radius, bot.x));
                bot.y = Math.max(bot.radius, Math.min(canvas.height / 1.5, bot.y));

                if (bot.moveX !== 0 || bot.moveY !== 0) {
                    bot.angle = Math.atan2(bot.moveY, bot.moveX);
                }

                let distToBall = Math.hypot(bot.x - ball.x, bot.y - ball.y);
                if (currentTarget === bot && distToBall < (ballSpeed * 12) && !bot.isBlocking) {
                    bot.isBlocking = true;
                    setTimeout(() => {
                        let finalDist = Math.hypot(bot.x - ball.x, bot.y - ball.y);
                        if (finalDist < 50 && currentTarget === bot) {
                            selectNewTarget(bot);
                            ballSpeed += 0.5;
                        }
                        setTimeout(() => { bot.isBlocking = false; }, 200);
                    }, Math.random() * 100 + 50);
                }
            });

            if (currentTarget) {
                let angleToTarget = Math.atan2(currentTarget.y - ball.y, currentTarget.x - ball.x);
                ball.x += Math.cos(angleToTarget) * ballSpeed;
                ball.y += Math.sin(angleToTarget) * ballSpeed;

                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 8) ball.trail.shift();
            }

            ball.trail.forEach((t, index) => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 0, 85, ${index / ball.trail.length * 0.4})`;
                ctx.fill();
            });

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (currentTarget) {
                let dist = Math.hypot(currentTarget.x - ball.x, currentTarget.y - ball.y);
                if (dist < currentTarget.radius + ball.radius) {
                    if (currentTarget.isPlayer) {
                        if (isBlocking) {
                            score++;
                            document.getElementById('score').innerText = score;
                            ballSpeed += 0.6;
                            selectNewTarget(player);
                        } else {
                            player.isAlive = false;
                            alert("💥 БУМ! Мяч выбил тебя! Нажми ОК для рестарта.");
                            restartGame();
                        }
                    } else {
                        if (currentTarget.isBlocking) {
                            selectNewTarget(currentTarget);
                        } else {
                            currentTarget.isAlive = false;
                            selectNewTarget();
                        }
                    }
                }
            }

            drawCharacter(player);
            bots.forEach(drawCharacter);

            requestAnimationFrame(update);
        }

        createBots();
        selectNewTarget();
        update();
    </script>
</body>
</html>
