<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 3D — Anti-Grey Screen Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #090914;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        canvas {
            display: block;
            background: #111126;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #ff2e63;
        }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 24px; font-weight: bold; pointer-events: none;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9); text-align: center; z-index: 10;
        }
        #instructions { font-size: 14px; color: #bbb; margin-top: 5px; }
        #alive-counter { font-size: 16px; color: #ff2e63; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        Счёт отбиваний: <span id="score">0</span>
        <div id="alive-counter">Осталось бойцов: <span id="bots-count">4</span></div>
        <div id="instructions">WASD / Стрелки — движение | ПРОБЕЛ — блок вовремя</div>
    </div>

    <!-- 2D холст, который симулирует 3D перспективу без участия сбойного WebGL -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // === ЧАСТЬ 1: МАТЕМАТИЧЕСКАЯ СИМУЛЯЦИЯ 3D ПРОСТРАНСТВА ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Мировые параметры арены
        const ARENA_WIDTH = 40;
        const ARENA_DEPTH = 40;

        // Координаты игрока в 3D мире
        let playerX = 0;
        let playerZ = 15;
        let playerAlive = true;
        let isBlocking = false;
        let blockCooldown = false;

        // Координаты мяча в 3D мире
        let ballX = 0;
        let ballY = 0;
        let ballZ = -15;
        let ballVelX = 0;
        let ballVelZ = 0;
        let ballSpeed = 0.25;

        // Настройки ИИ Ботов
        let bots = [
            {x: -12, z: -8, alive: true, timer: 0, dx: 0, dz: 0, blocking: false, color: '#9b5de5'},
            {x: 12, z: -8, alive: true, timer: 0, dx: 0, dz: 0, blocking: false, color: '#9b5de5'},
            {x: 0, z: -2, alive: true, timer: 0, dx: 0, dz: 0, blocking: false, color: '#9b5de5'}
        ];

        let currentTarget = null;
        let score = 0;
        let keys = {w:false, a:false, s:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false};

        // Главная функция псевдо-3D проекции (Превращает 3D координаты X, Y, Z в пиксели экрана)
        function project3D(x, y, z) {
            // Настройка виртуальной камеры от третьего лица (привязана к игроку)
            let camX = playerX;
            let camY = 6;
            let camZ = playerZ + 12;

            // Перевод координат относительно камеры
            let relX = x - camX;
            let relY = y - camY;
            let relZ = z - camZ;

            // Масштабирование перспективы (чем дальше Z, тем меньше объект на экране)
            let fov = 400; 
            let scale = fov / (relZ + fov); 
            if (scale < 0) scale = 0;

            // Центрирование картинки на холсте 800х600
            let screenX = 400 + relX * scale * 20;
            let screenY = 350 + relY * scale * 20;

            return { x: screenX, y: screenY, size: scale * 25 };
        }        // === ЧАСТЬ 2: ДВИЖОК ИГРЫ И ЦИКЛ ОТРИСОВКИ ПСЕВДО-3D ===
        window.addEventListener('keydown', (e) => {
            let k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true;
            if (e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'ArrowRight') keys.d = true;

            if (e.code === 'Space' && !blockCooldown && !isBlocking && playerAlive) {
                isBlocking = true;
                blockCooldown = true;
                setTimeout(() => {
                    isBlocking = false;
                    setTimeout(() => { blockCooldown = false; }, 400);
                }, 300); // Окно блока 300мс
            }
        });

        window.addEventListener('keyup', (e) => {
            let k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = false;
            if (e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'ArrowRight') keys.d = false;
        });

        function selectNewTarget(exception) {
            let pool = [];
            if (playerAlive && exception !== 'player') pool.push('player');
            bots.forEach((b, idx) => {
                if (b.alive && exception !== idx) pool.push(idx);
            });
            if (pool.length === 0 && exception !== null) {
                pool.push(exception);
            }
            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                bots.forEach(b => { if(b.alive) b.color = '#9b5de5'; });
                if (currentTarget !== 'player' && typeof currentTarget === 'number') {
                    bots[currentTarget].color = '#ff9f1c'; // Оранжевый индикатор цели
                }
            } else {
                currentTarget = null;
            }
            
            let count = (playerAlive ? 1 : 0) + bots.filter(b => b.alive).length;
            document.getElementById('bots-count').innerText = count;
            
            if (count === 1 && playerAlive) {
                alert("ПОБЕДА! Вы уничтожили всех ботов!");
                resetGame();
            }
        }

        function resetGame() {
            playerX = 0; playerZ = 15; playerAlive = true; isBlocking = false; blockCooldown = false;
            ballX = 0; ballY = 0; ballZ = -15; ballSpeed = 0.25; score = 0;
            document.getElementById('score').innerText = score;
            bots.forEach(b => {
                b.alive = true;
                b.x = (Math.random() - 0.5) * 24;
                b.z = (Math.random() - 0.5) * 20 - 5;
                b.blocking = false;
            });
            selectNewTarget();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            // Очищаем экран темно-синим цветом неба
            ctx.fillStyle = '#070714';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. Управление игроком
            if (playerAlive) {
                let speed = 0.25;
                if (keys.w && playerZ > -ARENA_DEPTH) playerZ -= speed;
                if (keys.s && playerZ < ARENA_DEPTH) playerZ += speed;
                if (keys.a && playerX > -ARENA_WIDTH) playerX -= speed;
                if (keys.d && playerX < ARENA_WIDTH) playerX += speed;
            }

            // 2. Логика ИИ ботов
            bots.forEach((bot, idx) => {
                if (!bot.alive) return;
                bot.timer--;
                if (bot.timer <= 0) {
                    bot.timer = Math.random() * 60 + 30;
                    bot.dx = (Math.random() - 0.5) * 0.15;
                    bot.dz = (Math.random() - 0.5) * 0.15;
                }
                bot.x += bot.dx; bot.z += bot.dz;
                bot.x = Math.max(-ARENA_WIDTH, Math.min(ARENA_WIDTH, bot.x));
                bot.z = Math.max(-ARENA_DEPTH, Math.min(ARENA_DEPTH, bot.z));

                // Блок бота
                let dist = Math.sqrt((bot.x - ballX)**2 + (bot.z - ballZ)**2);
                if (currentTarget === idx && dist < (4.0 + ballSpeed * 5) && !bot.blocking) {
                    if (Math.random() > 0.15) {
                        bot.blocking = true;
                        setTimeout(() => { bot.blocking = false; }, 250);
                    }
                }
            });

            // 3. Самонаведение мяча
            let tx = playerX, tz = playerZ;
            let isTargetBlocking = isBlocking;

            if (currentTarget !== 'player' && typeof currentTarget === 'number') {
                tx = bots[currentTarget].x; tz = bots[currentTarget].z;
                isTargetBlocking = bots[currentTarget].blocking;
            }

            let dx = tx - ballX, dz = tz - ballZ;
            let dist = Math.sqrt(dx*dx + dz*dz);

            if (dist > 0.1) {
                let ballVelX = (dx / dist) * ballSpeed;
                let ballVelZ = (dz / dist) * ballSpeed;
                ballX += ballVelX; ballZ += ballVelZ;
            }

            // Столкновения
            if (dist < 3.5) {
                if (isTargetBlocking) {
                    ballSpeed += 0.03;
                    if (currentTarget === 'player') {
                        score++;
                        document.getElementById('score').innerText = score;
                    }
                    selectNewTarget(currentTarget);
                } else if (dist < 1.3) {
                    if (currentTarget === 'player') {
                        playerAlive = false;
                        alert(`Игра окончена! Ваш счёт: ${score}`);
                        resetGame();
                    } else {
                        bots[currentTarget].alive = false;
                        ballSpeed = Math.max(0.25, ballSpeed - 0.05);
                        selectNewTarget(currentTarget);
                    }
                }
            }

            // === ОТРИСОВКА ПСЕВДО-3D ПРОСТРАНСТВА ===

            // Рисуем сетку пола арены (горизонтальные линии)
            ctx.strokeStyle = '#ff2e63';
            ctx.lineWidth = 1;
            for (let z = -ARENA_DEPTH; z <= ARENA_DEPTH; z += 4) {
                let p1 = project3D(-ARENA_WIDTH, 0, z);
                let p2 = project3D(ARENA_WIDTH, 0, z);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
            // Рисуем продольные линии пола
            for (let x = -ARENA_WIDTH; x <= ARENA_WIDTH; x += 4) {
                let p1 = project3D(x, 0, -ARENA_DEPTH);
                let p2 = project3D(x, 0, ARENA_DEPTH);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }

            // Собираем все живые объекты для сортировки по глубине (чтобы ближние перекрывали дальних)
            let drawQueue = [];

            bots.forEach(bot => {
                if (bot.alive) drawQueue.push({ z: bot.z, type: 'bot', obj: bot });
            });

            if (playerAlive) drawQueue.push({ z: playerZ, type: 'player', obj: player });

            drawQueue.push({ z: ballZ, type: 'ball', obj: { x: ballX, y: ballY, z: ballZ } });

            // Сортировка от дальних к ближним
            drawQueue.sort((a, b) => b.z - a.z);

            // Отрисовываем объекты
            drawQueue.forEach(item => {
                let p = project3D(item.obj.x, 0, item.obj.z);

                if (item.type === 'player') {
                    ctx.fillStyle = isBlocking ? '#00ff00' : '#00adb5';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y - p.size, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    // Тень под персонажем
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.size, p.size / 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                } 
                else if (item.type === 'bot') {
                    ctx.fillStyle = item.obj.blocking ? '#ffffff' : item.obj.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y - p.size, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    // Тень
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.size, p.size / 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                } 
                else if (item.type === 'ball') {
                    // Подпрыгивание мяча для динамики
                    let bBounce = -Math.abs(Math.sin(Date.now() * 0.005)) * 1.5;
                    let pBall = project3D(ballX, bBounce, ballZ);
                    
                    ctx.fillStyle = '#ff2e63';
                    ctx.beginPath();
                    ctx.arc(pBall.x, pBall.y - pBall.size, pBall.size * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    // Свечение мяча
                    ctx.strokeStyle = 'rgba(255, 46, 99, 0.5)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            });
        }

        // Запуск псевдо-3D движка
        selectNewTarget(null);
        gameLoop();
    </script>
</body>
</html>
