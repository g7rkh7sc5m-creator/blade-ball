<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 3D — 100% Fixed One File</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a14; font-family: sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 24px; font-weight: bold; pointer-events: none;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9); text-align: center; z-index: 10;
        }
        #instructions { font-size: 14px; color: #00adb5; margin-top: 5px; }
        #alive-counter { font-size: 16px; color: #ff2e63; margin-top: 5px; }
    </style>
    <!-- ВСТРОЕННОЕ ЯДРО THREE.JS — РАБОТАЕТ ВЕЗДЕ БЕЗ ОШИБОК И ИНТЕРНЕТА -->
    <script>
        !function(E,R){"object"==typeof exports&&"undefined"!=typeof module?R(exports):"function"==typeof define&&define.amd?define(["exports"],R):R((E=E||self).THREE={})}(this,function(E){"use strict";
        E.Vector3=function(x,y,z){this.x=x||0,this.y=y||0,this.z=z||0};E.Vector3.prototype={set:function(x,y,z){this.x=x;this.y=y;this.z=z;return this},addScaledVector:function(v,s){this.x+=v.x*s;this.y+=v.y*s;this.z+=v.z*s;return this},distanceTo:function(v){return Math.sqrt((this.x-v.x)**2+(this.y-v.y)**2+(this.z-v.z)**2)},normalize:function(){let l=Math.sqrt(this.x**2+this.y**2+this.z**2)||1;this.x/=l;this.y/=l;this.z/=l;return this},subVectors:function(a,b){this.x=a.x-b.x;this.y=a.y-b.y;this.z=a.z-b.z;return this},lerp:function(v,a){this.x+=(v.x-this.x)*a;this.y+=(v.y-this.y)*a;this.z+=(v.z-this.z)*a;return this},clone:function(){return new E.Vector3(this.x,this.y,this.z)}};

        E.PerspectiveCamera=function(f,a,n,x){this.position=new E.Vector3();this.target=new E.Vector3()};E.PerspectiveCamera.prototype={lookAt:function(x,y,z){this.target.set(x,y,z)},updateProjectionMatrix:function(){}};
        E.MeshBasicMaterial=function(p){this.color={hex:p&&p.color?p.color:0xffffff,setHex:function(h){this.hex=h}}};
        E.BoxGeometry=function(w,h,d){this.w=w;this.h=h;this.d=d;this.type="box"};E.SphereGeometry=function(r){this.w=r*2;this.h=r*2;this.d=r*2;this.type="sphere"};

            let renderList=sc.children.slice().sort((a,b)=>b.position.z-a.position.z);
            for(let i=0;i<renderList.length;i++){
                let o=renderList[i];let rx=o.position.x-cx,ry=o.position.y-(cy-1.5),rz=o.position.z-cz;

                    for(let g=-24;g<=24;g+=4){
                        let x1=w/2+(g-cx)*sz*22,y1=h/2-(0-cy+1.5)*sz*22;
                        ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.stroke();
                    }

    </script>
</head>
<body>

    <div id="ui">
        Счёт отбиваний: <span id="score">0</span>
        <div id="alive-counter">Осталось бойцов: <span id="bots-count">4</span></div>
        <div id="instructions">WASD / Стрелки — движение | ПРОБЕЛ — блок вовремя</div>
    </div>

    <script>
        // === НАСТРОЙКИ ИГРЫ И ГЕНЕРАЦИЯ ОБЪЕКТОВ ===
        let scene, camera, renderer, player, ball;
        let bots = [];
        let currentTarget = null;
        
        let keys = { w: false, a: false, s: false, d: false, Space: false };
        let ballSpeed = 0.18;
        let ballDirection = new THREE.Vector3();
        let score = 0;
        let isBlocking = false;
        let blockCooldown = false;

        const ARENA_SIZE = 25;
        const BOT_COUNT = 3;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Пол Арены (Настоящая 3D коробка под ногами)
            const floorGeo = new THREE.BoxGeometry(ARENA_SIZE * 2, 0.2, ARENA_SIZE * 2);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(0, -0.1, 0);
            scene.add(floor);

            // Игрок (Светящаяся неоново-синяя сфера)
            const playerGeo = new THREE.SphereGeometry(1);
            const playerMat = new THREE.MeshBasicMaterial({ color: 0x00adb5 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 1, 14);
            player.isPlayer = true;
            player.isAlive = true;
            scene.add(player);

            // Мяч-убийца (Красная сфера)
            const ballGeo = new THREE.SphereGeometry(0.8);
            const ballMat = new THREE.MeshBasicMaterial({ color: 0xff2e63 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(0, 1, -12);
            scene.add(ball);

            createBots();

            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            selectNewTarget();
            animate();
        }

        function createBots() {
            bots.forEach(b => scene.remove(b));
            bots = [];
            const botGeo = new THREE.SphereGeometry(1);

            for (let i = 0; i < BOT_COUNT; i++) {
                const botMat = new THREE.MeshBasicMaterial({ color: 0x9b5de5 });
                const bot = new THREE.Mesh(botGeo, botMat);
                bot.position.set((Math.random() - 0.5) * (ARENA_SIZE * 1.3), 1, (Math.random() - 0.5) * (ARENA_SIZE * 1.3));
                bot.isPlayer = false;
                bot.isAlive = true;
                bot.aiTimer = 0;
                bot.moveDir = new THREE.Vector3();
                bot.isBlocking = false;
                bots.push(bot);
                scene.add(bot);
            }
        } function selectNewTarget(exception) {
            let pool = [];
            if (player && player.isAlive && player !== exception) pool.push(player);
            bots.forEach(b => {
                if (b.isAlive && b !== exception) pool.push(b);
            });

            if (pool.length === 0 && exception && exception.isAlive) {
                pool.push(exception);
            }

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                bots.forEach(b => { if(b.isAlive) b.material.color.setHex(0x9b5de5); });
                if (player && player.isAlive && !isBlocking) player.material.color.setHex(0x00adb5);
                
                if (currentTarget !== player) {
                    currentTarget.material.color.setHex(0xff9f1c); // Цель подсвечивается оранжевым
                }
            } else {
                currentTarget = null;
            }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = ((player && player.isAlive) ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            
            if (count === 1 && player && player.isAlive) {
                alert("ПОБЕДА! Вы уничтожили всех ботов!");
                restartGame();
            }
        }

        function restartGame() {
            if (!player || !ball) return;
            player.isAlive = true;
            player.position.set(0, 1, 14);
            player.material.color.setHex(0x00adb5);
            
            createBots();
            
            ball.position.set(0, 1, -12);
            ballSpeed = 0.18;
            score = 0;
            document.getElementById('score').innerText = score;
            
            selectNewTarget();
        }

        function handleInput(e, isDown) {
            let key = e.key.toLowerCase();
            if (e.code === 'Space') key = 'Space';
            if (e.key === 'ArrowUp') key = 'w';
            if (e.key === 'ArrowDown') key = 's';
            if (e.key === 'ArrowLeft') key = 'a';
            if (e.key === 'ArrowRight') key = 'd';

            if (keys.hasOwnProperty(key)) keys[key] = isDown;

            if (key === 'Space' && isDown && !blockCooldown && !isBlocking && player && player.isAlive) {
                triggerPlayerBlock();
            }
        }

        function triggerPlayerBlock() {
            isBlocking = true;
            blockCooldown = true;
            player.material.color.setHex(0x00ff00); // Зеленый цвет щита

            setTimeout(() => {
                isBlocking = false;
                if (currentTarget === player) player.material.color.setHex(0xff9f1c);
                else player.material.color.setHex(0x00adb5);
                
                setTimeout(() => { blockCooldown = false; }, 400);
            }, 300); // Блок активен 300мс
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!player || !ball) return;

            // 1. Движение игрока
            if (player.isAlive) {
                const moveSpeed = 0.22;
                if (keys.w && player.position.z > -ARENA_SIZE) player.position.z -= moveSpeed;
                if (keys.s && player.position.z < ARENA_SIZE) player.position.z += moveSpeed;
                if (keys.a && player.position.x > -ARENA_SIZE) player.position.x -= moveSpeed;
                if (keys.d && player.position.x < ARENA_SIZE) player.position.x += moveSpeed;
            }

            // 2. Движение и авто-блок ботов
            bots.forEach(bot => {
                if (!bot.isAlive) return;

                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.random() * 60 + 30;
                    bot.moveDir.set(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                }

                bot.position.addScaledVector(bot.moveDir, 0.12);
                
                bot.position.x = Math.max(-ARENA_SIZE + 1, Math.min(ARENA_SIZE - 1, bot.position.x));
                bot.position.z = Math.max(-ARENA_SIZE + 1, Math.min(ARENA_SIZE - 1, bot.position.z));

                let distToBall = bot.position.distanceTo(ball.position);
                if (currentTarget === bot && distToBall < (3.0 + ballSpeed * 5) && !bot.isBlocking) {
                    let reactionChance = Math.random();
                    if (reactionChance > (ballSpeed * 0.5 - 0.05)) { 
                        bot.isBlocking = true;
                        bot.material.color.setHex(0xffffff); // Белая вспышка блока бота
                        
                        setTimeout(() => {
                            bot.isBlocking = false;
                            if (bot.isAlive) bot.material.color.setHex(0x9b5de5);
                        }, 250);
                    }
                }
            });

            // 3. Логика преследования мяча
            if (currentTarget && currentTarget.isAlive) {
                let targetDir = new THREE.Vector3().subVectors(currentTarget.position, ball.position).normalize();
                ballDirection.lerp(targetDir, 0.08); 
                ball.position.addScaledVector(ballDirection, ballSpeed);

                const distance = currentTarget.position.distanceTo(ball.position);

                if (distance < 3.5) {
                    let isTargetBlocking = currentTarget.isPlayer ? isBlocking : currentTarget.isBlocking;

                    if (isTargetBlocking) {
                        ballSpeed += 0.025; // Мяч ускоряется
                        if (currentTarget.isPlayer) {
                            score++;
                            document.getElementById('score').innerText = score;
                        }
                        selectNewTarget(currentTarget);
                    } 
                    else if (distance < 1.4) {
                        if (currentTarget.isPlayer) {
                            player.isAlive = false;
                            alert(`Вы выбыли! Счёт отбиваний: ${score}`);
                            restartGame();
                        } else {
                            currentTarget.isAlive = false;
                            scene.remove(currentTarget);
                            ballSpeed = Math.max(0.18, ballSpeed - 0.05);
                            selectNewTarget();
                        }
                    }
                }
            } else {
                selectNewTarget();
            }

            // 4. Следование 3D-камеры за игроком со спины
            if (player.isAlive) {
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.08);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, player.position.y + 6, 0.08);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, player.position.z + 12, 0.08);
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 2);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Запуск
        init();
    </script>
</body>
</html>
