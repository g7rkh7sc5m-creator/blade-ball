<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blade Ball 2.5D — Brawl Stars Style</title>
    <style>
        body { margin: 0; overflow: hidden; background: #070714; font-family: 'Arial Black', sans-serif; user-select: none; }
        #ui {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 26px; text-transform: uppercase; pointer-events: none;
            text-shadow: 3px 3px 0px #000; text-align: center; z-index: 10; letter-spacing: 1px;
        }
        #instructions { font-size: 13px; color: #00adb5; margin-top: 5px; text-shadow: 1px 1px 0px #000; }
        #alive-counter { font-size: 18px; color: #ff2e63; margin-top: 5px; }
        #danger-alert { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            color: #ff2e63; font-size: 32px; display: none; text-shadow: 2px 2px 0px #000;
            animation: blink 0.3s infinite alternate; font-weight: bold;
        }
        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
    <!-- Стабильная библиотека Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">
        ОТБИТО: <span id="score">0</span>
        <div id="alive-counter">ОСТАЛОСЬ БОЙЦОВ: <span id="bots-count">4</span></div>
        <div id="instructions">WASD / Стрелки — бег | ПРОБЕЛ — блок / парирование</div>
    </div>
    
    <div id="danger-alert">МЯЧ ЛЕТИТ В ТЕБЯ! БЛОКИРУЙ!</div>

    <script>        let scene, camera, renderer, player, ball;
        let bots = [];
        let currentTarget = null;
        let ballTrail = [];
        const MAX_TRAIL = 8;
        
        let keys = { w: false, a: false, s: false, d: false, Space: false };
        let ballSpeed = 0.22;
        let score = 0;
        let isBlocking = false;
        let blockCooldown = false;

        const ARENA_SIZE = 25;
        const BOT_COUNT = 4;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            
            // КАМЕРА В СТИЛЕ BRAWL STARS
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 32, 28); 
            camera.lookAt(0, -2, 4);        
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; 
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 40, 20);
            scene.add(dirLight);

            const floorGeo = new THREE.BoxGeometry(ARENA_SIZE * 2, 1, ARENA_SIZE * 2);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x16192b, roughness: 0.4 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            scene.add(floor);

            const grid = new THREE.GridHelper(ARENA_SIZE * 2, 16, 0x00adb5, 0x222538);
            grid.position.y = 0.02;
            scene.add(grid);

            player = createCharacter(0x00adb5);
            player.position.set(0, 0, 14);
            player.isPlayer = true;
            player.isAlive = true;
            scene.add(player);

            const ballGeo = new THREE.SphereGeometry(0.9, 16, 16);
            const ballMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(0, 1.2, -12);
            scene.add(ball);

            for (let i = 0; i < MAX_TRAIL; i++) {
                let tGeo = new THREE.SphereGeometry(0.7 * (1 - i/MAX_TRAIL), 8, 8);
                let tMat = new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.6 * (1 - i/MAX_TRAIL) });
                let tMesh = new THREE.Mesh(tGeo, tMat);
                scene.add(tMesh);
                ballTrail.push(tMesh);
            }

            createBots();

            window.addEventListener('keydown', (e) => handleInput(e, true));
            window.addEventListener('keyup', (e) => handleInput(e, false));
            window.addEventListener('resize', onWindowResize);

            selectNewTarget();
            animate();
        }

        // Конструктор человечков (Роблокс / Бравл Стайл)
        function createCharacter(colorHex) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });

            const torsoGeo = new THREE.CylinderGeometry(0.6, 0.5, 1.4, 12);
            const torso = new THREE.Mesh(torsoGeo, bodyMat);
            torso.position.y = 1.2;
            group.add(torso);

            const headGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 2.2;
            group.add(head);

            const armGeo = new THREE.CapsuleGeometry(0.2, 0.8, 4, 8);
            
            const leftArm = new THREE.Mesh(armGeo, bodyMat);
            leftArm.position.set(-0.8, 1.3, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, bodyMat);
            rightArm.position.set(0.8, 1.3, 0);
            group.add(rightArm);

            const ringGeo = new THREE.RingGeometry(1.1, 1.3, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.05;
            group.add(ring);

            group.userData = { leftArm, rightArm, ring, baseColor: colorHex };
            return group;
        }

        function createBots() {
            bots.forEach(b => scene.remove(b));
            bots = [];
            const botColors = [0x9b5de5, 0xf15bb5, 0x00f5d4, 0xfee440];

            for (let i = 0; i < BOT_COUNT; i++) {
                const bot = createCharacter(botColors[i % botColors.length]);
                bot.position.set((Math.random() - 0.5) * (ARENA_SIZE * 1.4), 0, (Math.random() - 0.5) * (ARENA_SIZE * 1.2));
                bot.isPlayer = false;
                bot.isAlive = true;
                bot.aiTimer = 0;
                bot.moveDir = new THREE.Vector3();
                bot.isBlocking = false;
                bots.push(bot);
                scene.add(bot);
            }
        }

        function selectNewTarget(exception) {
            let pool = [];
            if (player && player.isAlive && player !== exception) pool.push(player);
            bots.forEach(b => { if (b.isAlive && b !== exception) pool.push(b); });

            if (pool.length === 0 && exception && exception.isAlive) pool.push(exception);

            if (pool.length > 0) {
                currentTarget = pool[Math.floor(Math.random() * pool.length)];
                bots.forEach(b => { if(b.isAlive) b.userData.ring.material.opacity = 0; });
                player.userData.ring.material.opacity = 0;
                document.getElementById('danger-alert').style.display = 'none';

                currentTarget.userData.ring.material.opacity = 1;
                
                if (currentTarget === player) {
                    currentTarget.userData.ring.material.color.setHex(0xff0000); 
                    document.getElementById('danger-alert').style.display = 'block';
                } else {
                    currentTarget.userData.ring.material.color.setHex(0xffaa00); 
                }
            } else {
                currentTarget = null;
            }
            updateAliveCounter();
        }

        function updateAliveCounter() {
            let count = ((player && player.isAlive) ? 1 : 0) + bots.filter(b => b.isAlive).length;
            document.getElementById('bots-count').innerText = count;
            
            if (count === 1 && player && player.isAlive) {
                alert("👑 ПОБЕДА СТИЛЯ BRAWL STARS! Вы выбили всех челов!");
                restartGame();
            }
        }

        function restartGame() {
            if (!player || !ball) return;
            player.isAlive = true;
            player.position.set(0, 0, 14);
            createBots();
            ball.position.set(0, 1.2, -12);
            ballSpeed = 0.22;
            score = 0;
            document.getElementById('score').innerText = score;
            selectNewTarget();
        }        function handleInput(e, isDown) {
            let key = e.key.toLowerCase();
            if (e.code === 'Space') key = 'Space';
            if (e.key === 'ArrowUp') key = 'w';
            if (e.key === 'ArrowDown') key = 's';
            if (e.key === 'ArrowLeft') key = 'a';
            if (e.key === 'ArrowRight') key = 'd';

            if (keys.hasOwnProperty(key)) keys[key] = isDown;

            if (key === 'Space' && isDown && !blockCooldown && !isBlocking && player && player.isAlive) {
                triggerPlayerBlock();
            }
        }

        function triggerPlayerBlock() {
            isBlocking = true;
            blockCooldown = true;

            // Анимация рук вперед для блока
            player.userData.leftArm.rotation.x = -Math.PI / 2;
            player.userData.rightArm.rotation.x = -Math.PI / 2;
            player.userData.ring.material.color.setHex(0x00ff00); 

            setTimeout(() => {
                isBlocking = false;
                if (player.isAlive) {
                    player.userData.leftArm.rotation.x = 0;
                    player.userData.rightArm.rotation.x = 0;
                    player.userData.ring.material.color.setHex(currentTarget === player ? 0xff0000 : 0x00adb5);
                }
                setTimeout(() => { blockCooldown = false; }, 150); 
            }, 250);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!player || !ball || !currentTarget) return;

            // 1. Движение игрока и разворот модели
            if (player.isAlive) {
                const moveSpeed = 0.26;
                let moveX = 0;
                let moveZ = 0;

                if (keys.w && player.position.z > -ARENA_SIZE) moveZ -= moveSpeed;
                if (keys.s && player.position.z < ARENA_SIZE) moveZ += moveSpeed;
                if (keys.a && player.position.x > -ARENA_SIZE) moveX -= moveSpeed;
                if (keys.d && player.position.x < ARENA_SIZE) moveX += moveSpeed;

                player.position.x += moveX;
                player.position.z += moveZ;

                if (moveX !== 0 || moveZ !== 0) {
                    let angle = Math.atan2(moveX, moveZ);
                    player.rotation.y = angle;
                }
            }

            // 2. Логика ИИ ботов и их автоблоки
            bots.forEach(bot => {
                if (!bot.isAlive) return;

                bot.aiTimer--;
                if (bot.aiTimer <= 0) {
                    bot.aiTimer = Math.floor(Math.random() * 40) + 20;
                    bot.moveDir.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
                }

                const botSpeed = 0.16;
                bot.position.addScaledVector(bot.moveDir, botSpeed);
                bot.position.x = Math.max(-ARENA_SIZE, Math.min(ARENA_SIZE, bot.position.x));
                bot.position.z = Math.max(-ARENA_SIZE, Math.min(ARENA_SIZE, bot.position.z));

                if (bot.moveDir.lengthSq() > 0) {
                    bot.rotation.y = Math.atan2(bot.moveDir.x, bot.moveDir.z);
                }

                let distToBall = bot.position.clone().setY(1.2).distanceTo(ball.position);
                if (currentTarget === bot && distToBall < (ballSpeed * 14) && !bot.isBlocking) {
                    bot.isBlocking = true;
                    bot.userData.leftArm.rotation.x = -Math.PI / 2;
                    bot.userData.rightArm.rotation.x = -Math.PI / 2;
                    bot.userData.ring.material.opacity = 1;
                    bot.userData.ring.material.color.setHex(0x00ff00);
                    
                    setTimeout(() => {
                        if (bot.position.clone().setY(1.2).distanceTo(ball.position) < 4.0 && currentTarget === bot) {
                            selectNewTarget(bot);
                            ballSpeed += 0.02; 
                        }
                        setTimeout(() => {
                            bot.isBlocking = false;
                            if (bot.isAlive) {
                                bot.userData.leftArm.rotation.x = 0;
                                bot.userData.rightArm.rotation.x = 0;
                                bot.userData.ring.material.opacity = 0;
                            }
                        }, 200);
                    }, Math.random() * 80 + 30);
                }
            });

            // 3. Расчет хвоста (шлейфа) мяча
            for (let i = ballTrail.length - 1; i > 0; i--) {
                ballTrail[i].position.copy(ballTrail[i-1].position);
            }
            ballTrail[0].position.copy(ball.position);

            // 4. Движение мяча
            let targetPos = currentTarget.position.clone().setY(1.2);
            let dir = new THREE.Vector3().subVectors(targetPos, ball.position).normalize();
            ball.position.addScaledVector(dir, ballSpeed);

            // 5. Проверка столкновений
            let distance = ball.position.distanceTo(targetPos);
            if (distance < 2.0) {
                if (currentTarget.isPlayer) {
                    if (isBlocking) {
                        score++;
                        document.getElementById('score').innerText = score;
                        ballSpeed += 0.025; 
                        selectNewTarget(player);
                    } else {
                        player.isAlive = false;
                        alert("💥 БУМ! Тебя выбили с арены! Попробуй еще раз.");
                        restartGame();
                    }
                } else {
                    if (currentTarget.isBlocking) {
                        selectNewTarget(currentTarget);
                    } else {
                        currentTarget.isAlive = false;
                        scene.remove(currentTarget);
                        selectNewTarget();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
